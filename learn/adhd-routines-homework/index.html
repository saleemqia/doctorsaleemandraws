<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"روتين الواجبات والصباح لطفل مشتت الانتباه | د. سالي رزقو","title":"روتين الواجبات والصباح لطفل مشتت الانتباه","sum":"حيل بسيطة تقلل الصراخ وتساعد على التنظيم: قوائم مصوّرة، مؤقتات، ومكافآت فورية.","body":"<p>الصباحات والواجبات من أصعب أوقات اليوم في بيوت الأطفال المصابين بتشتت الانتباه. الفكرة ليست أن نطلب منه «التركيز أكثر»، بل أن <b>نجعل البيئة تساعده</b>.</p><h3>الصباح</h3><ul><li>جهّزوا الحقيبة والملابس في الليلة السابقة.</li><li>علّقوا قائمة بصور قصيرة: ألبس، آكل، أغسل أسناني، أخذ الحقيبة.</li><li>أعطوا تعليمة واحدة في كل مرة، بعد أن تنظروا إليه وتتأكدوا أنه سمعكم.</li></ul><h3>الواجبات</h3><ul><li>مكان ثابت، هادئ، بلا شاشات ومشتتات.</li><li>قسّموا الواجب إلى أجزاء صغيرة، مع استراحة حركة قصيرة بينها (مثلًا 10 دقائق عمل ثم 3 دقائق راحة).</li><li>استخدموا مؤقتًا مرئيًا حتى يرى الوقت.</li><li>ابدأوا بالأسهل لبناء الزخم، أو بالأصعب إن كان أنشط في البداية. جرّبوا واعتمدوا ما يناسبه.</li></ul><h3>التشجيع</h3><p>المكافأة الفورية الصغيرة أنفع من الكبيرة المتأخرة: كلمة مدح محددة («أعجبني أنك أنهيت المسألة الأولى»)، نجمة في جدول، أو وقت لعب قصير. وتجنبوا سحب الأنشطة الرياضية عقابًا، فهي تساعد على تهدئة الطاقة.</p><h3>إن لم يتحسن؟</h3><p>إذا استمر التوتر الشديد حول الواجبات أو ظهرت علامات تعب أو حزن أو رفض للمدرسة، فاستشيروا مختصًا. قد يكون وراء الأمر صعوبة تعلم أو قلق يحتاج إلى دعم محدد.</p>"},"en":{"pageTitle":"Morning and homework routines for a child with ADHD | Dr. Sally Rizqo","title":"Morning and homework routines for a child with ADHD","sum":"Simple tricks that reduce shouting and help organisation: picture checklists, timers and immediate rewards.","body":"<p>Mornings and homework are among the hardest moments in homes with a child with ADHD. The goal is not to tell them to \"focus harder\" but to <b>make the environment work for them</b>.</p><h3>Mornings</h3><ul><li>Prepare the bag and clothes the night before.</li><li>Post a short picture checklist: get dressed, eat, brush teeth, take bag.</li><li>Give one instruction at a time, after you have their eyes and know they heard you.</li></ul><h3>Homework</h3><ul><li>A fixed, quiet spot, free of screens and distractions.</li><li>Split the work into small parts with a short movement break between them (for example 10 minutes of work, 3 minutes of rest).</li><li>Use a visual timer so they can see time passing.</li><li>Start with the easiest to build momentum, or the hardest if they are freshest then. Try both and keep what works.</li></ul><h3>Encouragement</h3><p>Small immediate rewards work better than big delayed ones: specific praise (\"I liked how you finished the first problem\"), a star on a chart, or a short play break. Avoid taking away sport as punishment, as it helps settle energy.</p><h3>If it isn't improving</h3><p>If tension around homework stays high, or you see tiredness, sadness or school refusal, speak to a specialist. A learning difficulty or anxiety may be behind it and needs specific support.</p>"}},
