<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"كيف أستعد للاستشارة أونلاين مع طفلي؟ | د. سالي رزقو","title":"كيف أستعد للاستشارة أونلاين مع طفلي؟","sum":"قائمة قصيرة بما يفيد تجهيزه قبل الجلسة، وما الذي يحدث فيها.","body":"<p>الاستشارة أونلاين تشبه الزيارة العادية: نستمع إليكم ونفهم المخاوف ونضع خطوات واضحة. بعض التحضير البسيط يجعل الجلسة أنفع.</p><h3>قبل الموعد</h3><ul><li><b>اكتبوا مخاوفكم</b> ومتى بدأت وكيف تظهر في البيت والمدرسة، مع أمثلة.</li><li><b>جهّزوا التقارير السابقة</b> (تقييمات، تحاليل، تقارير مدرسية) لتشاركوها بالطريقة الآمنة التي سنتفق عليها. لا ترسلوها في الرسالة الأولى.</li><li><b>اختاروا مكانًا هادئًا</b> واتصالًا جيدًا بالإنترنت، وجهازًا مشحونًا.</li><li><b>حدّدوا هل سيحضر الطفل</b> كل الجلسة أم جزءًا منها. نقرر ذلك معكم بحسب عمره وحالته.</li></ul><h3>خلال الجلسة</h3><ul><li>نسمع قصة الطفل ونموّه وصحته وعلاقاته، ونسأل عن البيت والمدرسة.</li><li>قد نراقب لعب الطفل أو تواصله إن حضر.</li><li>في نهايتها نناقش فهمنا للحالة والخطوات الممكنة، ونجيب عن أسئلتكم.</li></ul><h3>بعد الجلسة</h3><p>نتفق على خطة ومتابعة. وفي بعض الحالات قد نوصي بتقييم حضوري أو بفحوص إضافية، وسنقول لكم ذلك بصراحة.</p><p>جميع المعلومات سرّية. الاستشارات أونلاين ليست للحالات الطارئة.</p>"},"en":{"pageTitle":"How do I prepare for an online consultation with my child? | Dr. Sally Rizqo","title":"How do I prepare for an online consultation with my child?","sum":"A short list of what helps to prepare before the session, and what happens during it.","body":"<p>An online consultation is like an ordinary visit: we listen, understand your concerns and agree clear steps. A little preparation makes the session more useful.</p><h3>Before the appointment</h3><ul><li><b>Write down your concerns</b>, when they began and how they show at home and school, with examples.</li><li><b>Gather earlier reports</b> (assessments, tests, school reports) to share in the secure way we agree. Don't send them in the first message.</li><li><b>Choose a quiet spot</b> with a good internet connection and a charged device.</li><li><b>Decide whether your child will attend</b> the whole session or part of it. We decide this with you, depending on their age and situation.</li></ul><h3>During the session</h3><ul><li>We hear about your child's story, development, health and relationships, and ask about home and school.</li><li>We may observe your child's play or communication if they attend.</li><li>At the end we discuss our understanding and the possible steps, and answer your questions.</li></ul><h3>After the session</h3><p>We agree a plan and follow-up. In some cases we may recommend an in-person assessment or additional tests, and we'll say so honestly.</p><p>All information is confidential. Online consultations are not for emergencies.</p>"}},
