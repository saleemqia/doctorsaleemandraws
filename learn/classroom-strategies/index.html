<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"للمعلمين: كيف تدعمون طفلًا مصابًا بالتوحد أو ADHD في الصف؟ | د. سالي رزقو","title":"للمعلمين: كيف تدعمون طفلًا مصابًا بالتوحد أو ADHD في الصف؟","sum":"تعديلات بسيطة في الجلوس والتعليمات والجدول تصنع فرقًا كبيرًا لهذا الطفل ولبقية الصف.","body":"<p>المعلم من أهم الناس في حياة هؤلاء الأطفال. معظم التعديلات المفيدة <b>بسيطة وعملية</b>، وتفيد الصف كله.</p><h3>البيئة</h3><ul><li>مقعد قريب من المعلم، بعيد عن النافذة والباب والضوضاء.</li><li>جدول يومي مرئي على السبورة، وتنبيه قبل أي تغيير في الحصة أو النشاط.</li><li>ركن هادئ يلجأ إليه الطفل عند الإرهاق الحسي.</li></ul><h3>التعليمات والتعلم</h3><ul><li>تعليمات قصيرة، واحدة في كل مرة، مع دعم مرئي كلما أمكن.</li><li>قسّموا المهام الطويلة إلى خطوات، وأعطوا وقتًا إضافيًا عند الحاجة.</li><li>وفّروا فرص حركة مقبولة: توزيع الأوراق، مسح السبورة، استراحة قصيرة.</li><li>استخدموا اهتمامات الطفل في الأمثلة والمهام.</li></ul><h3>السلوك والعلاقات</h3><ul><li>عزّزوا السلوك الإيجابي فورًا وبشكل محدد.</li><li>افهموا الوظيفة وراء السلوك قبل معاقبته: هل هو هروب من مهمة صعبة؟ إرهاق حسي؟ حاجة إلى انتباه؟</li><li>أعطوا الطفل تنبيهات خاصة بدل التوبيخ أمام زملائه.</li><li>شجّعوا الصف على التعاطف وتقبّل الاختلاف.</li></ul><h3>التعاون مع الأسرة</h3><p>تواصل منتظم مع الأهل (ملاحظات إيجابية وليست شكاوى فقط) يوحّد الأسلوب بين البيت والمدرسة. وإن لاحظتم صعوبات مستمرة عند طفل لم يُقيَّم بعد، فصارحوا الأهل بلطف واقترحوا عليهم طلب تقييم متخصص.</p><p>للمدارس والجهات التي ترغب بورشة تدريبية للمعلمين، تواصلوا معنا عبر واتساب.</p>"},"en":{"pageTitle":"For teachers: supporting an autistic child or a child with ADHD in class | Dr. Sally Rizqo","title":"For teachers: supporting an autistic child or a child with ADHD in class","sum":"Simple changes to seating, instructions and schedule make a big difference for this child and for the whole class.","body":"<p>Teachers are among the most important people in these children's lives. Most helpful adjustments are <b>simple and practical</b>, and they benefit the whole class.</p><h3>Environment</h3><ul><li>A seat close to the teacher, away from the window, door and noise.</li><li>A visual daily schedule on the board, and a heads-up before any change of lesson or activity.</li><li>A quiet corner the child can go to when sensory overload builds up.</li></ul><h3>Instructions and learning</h3><ul><li>Short instructions, one at a time, with visual support whenever possible.</li><li>Break long tasks into steps and allow extra time when needed.</li><li>Provide acceptable movement: handing out papers, cleaning the board, a short break.</li><li>Use the child's interests in examples and tasks.</li></ul><h3>Behaviour and relationships</h3><ul><li>Reinforce positive behaviour immediately and specifically.</li><li>Understand the function behind a behaviour before punishing it: escaping a hard task? sensory overload? a need for attention?</li><li>Use private cues instead of reprimands in front of classmates.</li><li>Encourage the class to show empathy and accept difference.</li></ul><h3>Working with families</h3><p>Regular contact with parents (positive notes, not only complaints) aligns approaches between home and school. If you notice lasting difficulties in a child who has not been assessed, tell the parents kindly and suggest they seek a specialist assessment.</p><p>Schools and organisations wanting a training workshop for teachers can contact us on WhatsApp.</p>"}},
