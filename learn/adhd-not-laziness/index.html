window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"فرط الحركة وتشتت الانتباه: ليس كسلًا وليس سوء تربية | د. سالي رزقو","title":"فرط الحركة وتشتت الانتباه: ليس كسلًا وليس سوء تربية","sum":"كيف يبدو ADHD في البيت والمدرسة، ولماذا يحتاج الطفل إلى فهم وليس إلى لوم.","body":"<p>اضطراب فرط الحركة وتشتت الانتباه (ADHD) حالة نمائية تؤثر على تنظيم الانتباه والاندفاع والنشاط. هو <b>ليس كسلًا، وليس قلة ذكاء، وليس نتيجة تربية خاطئة</b>. كثير من الأطفال المصابين أذكياء جدًا، لكن أدمغتهم تعمل بطريقة مختلفة في التركيز والتنظيم.</p><h3>كيف يظهر في البيت والمدرسة؟</h3><ul><li><b>تشتت الانتباه:</b> ينسى الأغراض والواجبات، يبدو كأنه لا يسمع، يترك المهام نصف مكتملة، يتعب من الأعمال الطويلة.</li><li><b>فرط الحركة:</b> صعوبة في الجلوس، حركة مستمرة، كلام كثير.</li><li><b>الاندفاع:</b> مقاطعة الآخرين، صعوبة الانتظار، قرارات سريعة دون تفكير.</li></ul><p>وقد تظهر عند البنات بصورة أهدأ، كأحلام يقظة وشرود وتنظيم ضعيف، فيتأخر التعرف عليها.</p><h3>متى نفكر في التقييم؟</h3><p>حين تستمر هذه الصعوبات أكثر من ستة أشهر، وتظهر في أكثر من مكان (البيت والمدرسة)، وتؤثر فعلًا على التعلم والعلاقات والسلوك. التقييم يجمع معلومات من الأهل والمعلمين، ويستبعد أسبابًا أخرى كالقلق وصعوبات التعلم ومشاكل السمع أو النوم.</p><h3>ما الذي يساعد؟</h3><ul><li>تفهّم الحالة والتوقف عن اللوم، فهو يخفف الضغط على الطفل والأسرة.</li><li>روتين ثابت، وتعليمات قصيرة، ومهام مقسمة إلى خطوات صغيرة.</li><li>تعاون مع المدرسة: مقعد قريب من المعلم، فترات راحة، وقت إضافي.</li><li>نشاط بدني منتظم ونوم كافٍ.</li><li>في بعض الحالات يصف الطبيب علاجًا دوائيًا بعد تقييم دقيق وبمتابعة منتظمة، وهو قرار طبي يُتخذ مع الأسرة.</li></ul><p>الطفل الذي يفهمه من حوله يتحسن ثقته بنفسه، وهذا من أهم عوامل نجاحه.</p>"},"en":{"pageTitle":"ADHD is not laziness and not bad parenting | Dr. Sally Rizqo","title":"ADHD is not laziness and not bad parenting","sum":"What ADHD looks like at home and at school, and why a child needs understanding, not blame.","body":"<p>Attention-deficit/hyperactivity disorder (ADHD) is a developmental condition affecting the regulation of attention, impulses and activity. It is <b>not laziness, not low intelligence and not the result of poor parenting</b>. Many children with ADHD are very bright, but their brains work differently when it comes to focus and organisation.</p><h3>What it can look like at home and school</h3><ul><li><b>Inattention:</b> forgets belongings and homework, seems not to listen, leaves tasks half-done, tires with long tasks.</li><li><b>Hyperactivity:</b> trouble sitting still, constant movement, talking a lot.</li><li><b>Impulsivity:</b> interrupting, difficulty waiting, quick decisions without thinking.</li></ul><p>In girls it often looks quieter (daydreaming, drifting, poor organisation), so it is recognised later.</p><h3>When to think about an assessment</h3><p>When these difficulties last more than six months, appear in more than one setting (home and school) and genuinely affect learning, relationships or behaviour. Assessment gathers information from parents and teachers and rules out other causes such as anxiety, learning difficulties, or hearing and sleep problems.</p><h3>What helps</h3><ul><li>Understanding the condition and dropping blame, which eases pressure on the child and family.</li><li>A steady routine, short instructions and tasks broken into small steps.</li><li>Working with school: a seat near the teacher, movement breaks, extra time.</li><li>Regular physical activity and enough sleep.</li><li>In some cases a doctor prescribes medication after careful assessment and with regular follow-up. This is a medical decision made together with the family.</li></ul><p>A child who is understood gains confidence, and confidence is one of the strongest predictors of success.</p>"}},
