<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"متى تحتاج المراهقة إلى مساعدة متخصصة؟ | د. سالي رزقو","title":"متى تحتاج المراهقة إلى مساعدة متخصصة؟","sum":"الفرق بين التقلب الطبيعي وعلامات القلق والاكتئاب التي لا ينبغي تجاهلها.","body":"<p>التقلب المزاجي والرغبة في العزلة أحيانًا جزء طبيعي من المراهقة. لكن هناك علامات تقول إن المراهق يحتاج إلى أكثر من الوقت.</p><h3>علامات تستحق الانتباه</h3><ul><li>حزن أو تهيّج مستمر أكثر من أسبوعين.</li><li>فقدان الاهتمام بما كان يحبه، أو الانسحاب من الأصدقاء.</li><li>تغيّر واضح في النوم (أرق أو نوم مفرط) أو الشهية أو الوزن.</li><li>تراجع مفاجئ في الدراسة أو رفض الذهاب إلى المدرسة.</li><li>قلق شديد، نوبات هلع، أو شكاوى جسدية متكررة (صداع، ألم بطن) دون سبب طبي.</li><li>سلوك محفوف بالمخاطر أو غضب شديد غير معتاد.</li><li>حديث عن اليأس أو أنه «عبء» أو عن إيذاء النفس.</li></ul><div class=\"alert\">إذا ذكر المراهق رغبة في إيذاء نفسه أو إنهاء حياته، فهذه حالة طارئة: ابقوا معه، واطلبوا مساعدة طبية عاجلة أو توجهوا إلى أقرب مستشفى.</div><h3>كيف أتصرف؟</h3><ol><li>ابدأوا بالسؤال بهدوء وحنان، دون اتهام.</li><li>صدّقوا ما يقول حتى لو بدا لكم صغيرًا.</li><li>اطلبوا تقييمًا من مختص، وأخبروه أن طلب المساعدة قوة وليس ضعفًا.</li><li>حافظوا على روتين النوم والأكل والنشاط البدني قدر الإمكان.</li></ol><p>كلما بدأ الدعم مبكرًا كانت النتائج أفضل، وكثير من المراهقين يتحسنون كثيرًا بالدعم المناسب.</p>"},"en":{"pageTitle":"When does a teenager need specialist help? | Dr. Sally Rizqo","title":"When does a teenager need specialist help?","sum":"The difference between normal moodiness and signs of anxiety or depression that should not be ignored.","body":"<p>Moodiness and wanting time alone are a normal part of adolescence. But some signs say a teenager needs more than time.</p><h3>Signs worth attention</h3><ul><li>Sadness or irritability lasting more than two weeks.</li><li>Losing interest in things they loved, or withdrawing from friends.</li><li>Clear changes in sleep (insomnia or sleeping too much), appetite or weight.</li><li>A sudden drop in school performance, or refusing to go to school.</li><li>Intense worry, panic attacks, or repeated physical complaints (headaches, stomach aches) without a medical cause.</li><li>Risky behaviour or unusually intense anger.</li><li>Talk of hopelessness, being a \"burden\", or self-harm.</li></ul><div class=\"alert\">If a teenager mentions wanting to harm themselves or end their life, this is an emergency: stay with them and seek urgent medical help or go to the nearest hospital.</div><h3>What can I do?</h3><ol><li>Ask calmly and warmly, without accusing.</li><li>Believe what they say even if it seems small to you.</li><li>Seek an assessment from a specialist, and tell them that asking for help is strength, not weakness.</li><li>Keep sleep, meals and physical activity as steady as possible.</li></ol><p>The earlier support begins, the better the outcome, and many teenagers improve a great deal with the right help.</p>"}},
