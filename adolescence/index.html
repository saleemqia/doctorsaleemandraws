ar:{
pageTitle:"المراهقة | د. سالي رزقو",
title:"المراهقة",
lead:"مرحلة تغيّر طبيعي في الجسم والعقل والعلاقات. تقلّب المزاج والرغبة في الخصوصية أمران متوقعان، لكن بعض التغيرات تشير إلى ضيق حقيقي يحتاج انتباهًا ودعمًا.",
myth:"إنها «مرحلة وتعدّي»، والحديث عن المشاعر يضعف المراهق.",
fact:"كثير من الاضطرابات النفسية تبدأ في هذا العمر، والتدخل المبكر يغيّر مسارها. الحديث عن المشاعر قوة لا ضعف.",
fam:`<h3>للعائلات: متى أقلق؟ وكيف أتحدث؟</h3>
<table class="compare"><tr><th>غالبًا طبيعي</th><th>يستحق الانتباه والاستشارة</th></tr>
<tr><td>تقلّب المزاج لساعات أو أيام</td><td>حزن أو عصبية مستمرة لأكثر من أسبوعين</td></tr>
<tr><td>وقت أطول مع الأصدقاء</td><td>الانسحاب من الأصدقاء والعائلة معًا</td></tr>
<tr><td>السهر أحيانًا</td><td>تغيّر كبير في النوم أو الأكل</td></tr>
<tr><td>خلافات حول القواعد</td><td>تراجع واضح ومفاجئ في الدراسة</td></tr>
<tr><td>الرغبة في الخصوصية</td><td>فقدان الاهتمام بكل ما كان يحبه</td></tr></table>
<div class="alert">أي حديث عن إيذاء النفس أو عدم الرغبة في الحياة يستدعي طلب المساعدة في اليوم نفسه. لا تنتظروا: اتصلوا بالطوارئ أو توجهوا إلى أقرب مستشفى.</div>
<h4>كيف تفتحون باب الحديث؟</h4>
<ul class="checklist"><li><b>استمعوا أكثر مما تتكلمون.</b> الهدف أن يشعر بأنه مسموع، لا أن تحلّوا المشكلة فورًا.</li><li><b>تحدثوا جنبًا إلى جنب:</b> في السيارة، أثناء المشي، أو تحضير الطعام. أسهل من الجلوس وجهًا لوجه.</li><li><b>اعترفوا بمشاعره قبل النصيحة:</b> «يبدو أن هذا أزعجك كثيرًا» تفتح الباب، و«لا تكبّر الموضوع» تغلقه.</li><li><b>تجنبوا المحاضرات والمقارنة</b> بالإخوة أو أبناء الأقارب.</li><li><b>احترموا خصوصيته</b> مع حدود واضحة للسلامة، خاصة في الهاتف ووسائل التواصل.</li><li><b>كونوا قدوة:</b> تحدثوا عن مشاعركم أنتم بهدوء.</li></ul>
<p>أداة مفيدة: اقترحوا على ابنكم أو ابنتكم <a href="/play/#thermo">مقياس مشاعري</a>، فهو بداية سهلة لحديث صعب.</p>
<h4>متى تحجزون استشارة؟</h4><p>إذا استمرت التغيرات أكثر من أسبوعين، أو أثرت على الدراسة والعلاقات، أو أصبح الحديث معه مستحيلًا.</p>`,
tea:`<h3>للمعلمين: أول من يلاحظ</h3>
<p>المعلم يرى الطالب ساعات كل يوم، وغالبًا ما يلاحظ التغيّر قبل الأهل.</p>
<h4>علامات تستحق الانتباه</h4>
<ul><li>تراجع مفاجئ في الدرجات أو الحضور.</li><li>انسحاب من الأصدقاء، أو تغيّر واضح في المظهر أو الطاقة.</li><li>تعليقات أو كتابات عن اليأس أو إيذاء النفس.</li></ul>
<h4>ماذا تفعلون؟</h4>
<ul class="checklist"><li>خصصوا وقتًا قصيرًا للحديث الفردي بعيدًا عن الصف: «لاحظتُ أنك لست على طبيعتك، هل كل شيء بخير؟».</li><li>تعاملوا بجدية مع أي تنمّر، بما فيه التنمّر الإلكتروني.</li><li>أشركوا المرشد التربوي والأهل.</li><li>لا تَعِدوا الطالب بكتمان ما يمس سلامته، ووضّحوا ذلك بلطف منذ البداية.</li></ul>`,
res:`<h3>للباحثين والمختصين</h3>
<div class="stat-row"><div class="stat"><b>1 / 7</b><span>من عمر 10–19 سنة لديه اضطراب نفسي (منظمة الصحة العالمية)</span></div><div class="stat"><b>~35%</b><span>من الاضطرابات النفسية تبدأ قبل عمر 14 (Solmi 2022)</span></div><div class="stat"><b>~48%</b><span>تبدأ قبل عمر 18 (Solmi 2022)</span></div></div>
<h4>التقييم</h4>
<ul><li>إطار <span class="ltr">HEADSSS</span> للمقابلة النفسية الاجتماعية الشاملة: البيت، الدراسة، الأنشطة، المواد، الجنسانية، الانتحار والاكتئاب، السلامة.</li><li>أدوات فحص: <span class="ltr">PHQ-A</span> للاكتئاب، <span class="ltr">GAD-7</span> للقلق.</li><li>قابلوا المراهق منفردًا جزءًا من الجلسة، ووضّحوا حدود السرية منذ البداية.</li></ul>
<h4>تقييم خطر الانتحار</h4>
<p>اسألوا عن الأفكار الانتحارية وإيذاء النفس بشكل مباشر وصريح. الأدلة تُظهر أن السؤال لا يزيد الخطر (Dazzi 2014).</p>
<div class="collab"><b>فجوة بحثية محلية:</b> الدراسات عن الصحة النفسية للمراهقين في إقليم كوردستان، وعن أثر النزوح والضغوط الاجتماعية، ما زالت محدودة.</div>
<h4>{refsTitle}</h4>
<ol class="refs ltr">
<li>World Health Organization. Mental health of adolescents (fact sheet). <a href="https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health">who.int</a></li>
<li>Solmi M, et al. Age at onset of mental disorders worldwide: large-scale meta-analysis of 192 epidemiological studies. <i>Mol Psychiatry</i>. 2022;27:281–295. <a href="https://doi.org/10.1038/s41380-021-01161-7">doi</a></li>
<li>Richardson LP, et al. Evaluation of the PHQ-9 item for detecting major depression among adolescents. <i>Pediatrics</i>. 2010;126(6):1117–1123. <a href="https://doi.org/10.1542/peds.2010-0852">doi</a></li>
<li>Dazzi T, et al. Does asking about suicide and related behaviours induce suicidal ideation? What is the evidence? <i>Psychol Med</i>. 2014;44(16):3361–3363. <a href="https://doi.org/10.1017/S0033291714001299">doi</a></li>
</ol>`
},

en:{
pageTitle:"Adolescence | Dr. Sally Rizqo",
title:"Adolescence",
lead:"A time of natural change in body, mind and relationships. Mood swings and a wish for privacy are expected, but some changes signal real distress that needs attention and support.",
myth:"It's \"just a phase\", and talking about feelings makes teenagers weak.",
fact:"Many mental health conditions begin at this age, and early help changes their course. Talking about feelings is a strength, not a weakness.",
fam:`<h3>For families: when to worry, and how to talk</h3>
<table class="compare"><tr><th>Usually normal</th><th>Worth attention and a consultation</th></tr>
<tr><td>Mood swings lasting hours or days</td><td>Sadness or irritability for more than two weeks</td></tr>
<tr><td>More time with friends</td><td>Withdrawing from both friends and family</td></tr>
<tr><td>Staying up late sometimes</td><td>Big changes in sleep or eating</td></tr>
<tr><td>Arguments about rules</td><td>A sudden, clear drop in schoolwork</td></tr>
<tr><td>Wanting privacy</td><td>Losing interest in everything they enjoyed</td></tr></table>
<div class="alert">Any talk of self-harm or not wanting to live needs help the same day. Don't wait: call emergency services or go to the nearest hospital.</div>
<h4>How to open the conversation</h4>
<ul class="checklist"><li><b>Listen more than you talk.</b> The goal is for them to feel heard, not for you to fix things straight away.</li><li><b>Talk side by side:</b> in the car, on a walk, while cooking. Easier than sitting face to face.</li><li><b>Acknowledge feelings before advice:</b> "That sounds really upsetting" opens the door; "Don't make a big deal of it" closes it.</li><li><b>Avoid lectures and comparisons</b> with siblings or cousins.</li><li><b>Respect privacy</b> while keeping clear safety limits, especially around phones and social media.</li><li><b>Model it:</b> talk calmly about your own feelings.</li></ul>
<p>A useful tool: suggest the <a href="/play/#thermo">feelings check-in</a> to your teenager. It's an easy start to a hard conversation.</p>
<h4>When to book a consultation</h4><p>If changes last more than two weeks, affect studies or relationships, or talking with them feels impossible.</p>`,
tea:`<h3>For teachers: often the first to notice</h3>
<p>Teachers see students for hours every day and often notice change before parents do.</p>
<h4>Signs worth attention</h4>
<ul><li>A sudden drop in grades or attendance.</li><li>Withdrawing from friends, or a clear change in appearance or energy.</li><li>Comments or writing about hopelessness or self-harm.</li></ul>
<h4>What to do</h4>
<ul class="checklist"><li>Make time for a short one-to-one talk away from the class: "I've noticed you don't seem yourself. Is everything okay?"</li><li>Take all bullying seriously, including cyberbullying.</li><li>Involve the school counsellor and parents.</li><li>Never promise secrecy about anything affecting safety, and explain this gently from the start.</li></ul>`,
res:`<h3>For researchers and specialists</h3>
<div class="stat-row"><div class="stat"><b>1 / 7</b><span>10–19-year-olds has a mental disorder (WHO)</span></div><div class="stat"><b>~35%</b><span>of mental disorders begin before age 14 (Solmi 2022)</span></div><div class="stat"><b>~48%</b><span>begin before age 18 (Solmi 2022)</span></div></div>
<h4>Assessment</h4>
<ul><li>HEADSSS framework for a thorough psychosocial interview: Home, Education, Activities, Drugs, Sexuality, Suicide/depression, Safety.</li><li>Screening tools: PHQ-A for depression, GAD-7 for anxiety.</li><li>See the adolescent alone for part of the session, and explain the limits of confidentiality at the start.</li></ul>
<h4>Suicide risk assessment</h4>
<p>Ask about suicidal thoughts and self-harm directly and clearly. Evidence shows asking does not increase risk (Dazzi 2014).</p>
<div class="collab"><b>Local research gap:</b> studies of adolescent mental health in the Kurdistan Region, including the effects of displacement and social stressors, remain limited.</div>
<h4>{refsTitle}</h4>
<ol class="refs">
<li>World Health Organization. Mental health of adolescents (fact sheet). <a href="https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health">who.int</a></li>
<li>Solmi M, et al. Age at onset of mental disorders worldwide: large-scale meta-analysis of 192 epidemiological studies. <i>Mol Psychiatry</i>. 2022;27:281–295. <a href="https://doi.org/10.1038/s41380-021-01161-7">doi</a></li>
<li>Richardson LP, et al. Evaluation of the PHQ-9 item for detecting major depression among adolescents. <i>Pediatrics</i>. 2010;126(6):1117–1123. <a href="https://doi.org/10.1542/peds.2010-0852">doi</a></li>
<li>Dazzi T, et al. Does asking about suicide and related behaviours induce suicidal ideation? What is the evidence? <i>Psychol Med</i>. 2014;44(16):3361–3363. <a href="https://doi.org/10.1017/S0033291714001299">doi</a></li>
</ol>`
