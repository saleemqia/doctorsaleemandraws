ar:{
pageTitle:"فرط الحركة وتشتت الانتباه | د. سالي رزقو",
title:"فرط الحركة وتشتت الانتباه",
lead:"حالة نمائية تؤثر على قدرة الطفل على التركيز وضبط حركته والتحكم في اندفاعه. مع الفهم الصحيح والدعم المناسب ينجح كثير من هؤلاء الأطفال نجاحًا لافتًا.",

fam:`<h3>للعائلات: فهم بلا لوم</h3>
<p>كل الأطفال يتحركون ويسرحون أحيانًا. الفرق أن الأعراض هنا تستمر ستة أشهر على الأقل، وتظهر في البيت والمدرسة معًا، وتعيق حياة الطفل اليومية.</p>
<ul><li><b>تشتت الانتباه:</b> ينسى كثيرًا، يضيّع أغراضه، لا يكمل المهام، يبدو وكأنه لا يسمع.</li><li><b>فرط الحركة:</b> لا يستطيع البقاء جالسًا، يتململ، يتكلم كثيرًا.</li><li><b>الاندفاع:</b> يجيب قبل انتهاء السؤال، يقاطع، يصعب عليه انتظار دوره.</li></ul>
<p>البنات كثيرًا ما يظهر لديهن تشتت الانتباه بهدوء دون حركة زائدة، فيتأخر اكتشافه.</p>
<h4>ماذا يساعد في البيت؟</h4>
<ul class="checklist"><li>روتين ثابت للنوم والطعام والواجبات. <a href="/play/#schedule">جدولي اليومي</a> يجعله مرئيًا.</li><li>تعليمات قصيرة مع تواصل بالعين، وطلب واحد في كل مرة.</li><li>قسّموا المهام الكبيرة إلى خطوات صغيرة، مع استراحات حركة كل 15–20 دقيقة.</li><li>امدحوا السلوك الجيد فورًا وبتحديد: «أحسنت، أكملت الصفحة كلها».</li><li>قللوا وقت الشاشات، خاصة قبل النوم، فقلة النوم تزيد الأعراض.</li><li>عند الغضب: <a href="/play/#breath">فقاعة التنفس</a> لدقيقة قبل الحديث.</li></ul>
<h4>عن الدواء</h4>
<p>العلاج الدوائي قرار طبي يُتخذ بعد تقييم كامل ومع متابعة منتظمة. هو آمن وفعّال لكثير من الأطفال حين يُستخدم بإشراف طبي. ناقشوه مع الطبيب ولا تعتمدوا على تجارب الآخرين.</p>
<h4>متى تحجزون استشارة؟</h4><p>إذا كانت المدرسة تشتكي باستمرار، أو أثّر التشتت على تحصيل طفلكم وعلاقاته، أو تريدون مناقشة خيارات العلاج.</p>`,
tea:`<h3>للمعلمين: من الفوضى إلى التركيز</h3>
<h4>داخل الصف</h4>
<ul class="checklist"><li>أجلسوا الطالب قرب المعلم وبعيدًا عن النوافذ والباب.</li><li>اسمحوا بحركة منظّمة: توزيع الأوراق، مسح السبورة، إحضار شيء.</li><li>قسّموا الواجب إلى أجزاء قصيرة مع تحقق سريع بعد كل جزء.</li><li>تعليمات مكتوبة على السبورة إلى جانب التعليمات الشفهية.</li><li>إشارة سرية متفق عليها لإعادة الانتباه بدل النداء أمام الصف.</li></ul>
<h4>بطاقة المتابعة اليومية</h4>
<p>بطاقة بسيطة بين المدرسة والبيت فيها هدفان أو ثلاثة فقط (مثل: «أكمل الواجب الصفي»، «انتظر دوره»). يقيّمها المعلم يوميًا، ويكافئ الأهل في البيت. هذه من أكثر الأدوات المدرسية فعالية.</p>
<h4>ما يجب تجنبه</h4>
<ul><li>الإحراج أمام الصف، أو حرمان الطالب من الاستراحة كعقاب، فهو يحتاج الحركة.</li><li>وصف الطالب بالكسل أو قلة الأدب.</li></ul>`,
res:`<h3>للباحثين والمختصين</h3>
<div class="stat-row"><div class="stat"><b>~5.3%</b><span>الانتشار العالمي المجمّع لدى الأطفال والمراهقين (Polanczyk 2007)</span></div><div class="stat"><b>≥ 6</b><span>أعراض في أحد المجالين (5 من عمر 17)</span></div><div class="stat"><b>&lt; 12</b><span>عمر بداية الأعراض وفق DSM-5-TR</span></div></div>
<h4>التشخيص</h4>
<ul><li>معايير DSM-5-TR: أعراض مستمرة لستة أشهر، في بيئتين على الأقل، مع أثر واضح على الأداء.</li><li>الأنماط: غالب تشتت الانتباه، غالب فرط الحركة والاندفاع، أو مشترك.</li><li>قيّموا الحالات المصاحبة: صعوبات التعلم، القلق، اضطرابات السلوك والنوم، والتوحد.</li></ul>
<h4>أدوات التقييم</h4>
<ul><li>مقياس <span class="ltr">Vanderbilt</span> أو <span class="ltr">SNAP-IV</span>، من الأهل والمعلم معًا.</li></ul>
<h4>العلاج المدعوم بالأدلة</h4>
<ul><li>من 4 إلى 5 سنوات: تدريب الأهل السلوكي هو الخط الأول.</li><li>من 6 سنوات: الدواء مع التدخل السلوكي والدعم المدرسي.</li><li>الميثيلفينيدات خيار أول لدى الأطفال والمراهقين في التحليل الشبكي (Cortese 2018).</li></ul>
<div class="collab"><b>فجوة بحثية محلية:</b> الدراسات عن انتشار فرط الحركة وتشتت الانتباه في إقليم كوردستان، والنسخ المعتمدة بالكوردية من مقاييس التقييم، ما زالت محدودة.</div>
<h4>{refsTitle}</h4>
<ol class="refs ltr">
<li>Wolraich ML, et al. Clinical practice guideline for the diagnosis, evaluation, and treatment of ADHD in children and adolescents. <i>Pediatrics</i>. 2019;144(4):e20192528. <a href="https://doi.org/10.1542/peds.2019-2528">doi</a></li>
<li>Faraone SV, et al. The World Federation of ADHD International Consensus Statement: 208 evidence-based conclusions about the disorder. <i>Neurosci Biobehav Rev</i>. 2021;128:789–818. <a href="https://doi.org/10.1016/j.neubiorev.2021.01.022">doi</a></li>
<li>Cortese S, et al. Comparative efficacy and tolerability of medications for ADHD in children, adolescents, and adults. <i>Lancet Psychiatry</i>. 2018;5(9):727–738. <a href="https://doi.org/10.1016/S2215-0366(18)30269-4">doi</a></li>
<li>Polanczyk G, et al. The worldwide prevalence of ADHD: a systematic review and metaregression analysis. <i>Am J Psychiatry</i>. 2007;164(6):942–948. <a href="https://doi.org/10.1176/ajp.2007.164.6.942">doi</a></li>
<li>NICE. Attention deficit hyperactivity disorder: diagnosis and management (NG87). <a href="https://www.nice.org.uk/guidance/ng87">nice.org.uk</a></li>
</ol>`

en:{
pageTitle:"ADHD | Dr. Sally Rizqo",
title:"ADHD",
lead:"A developmental condition that affects a child's ability to focus, manage movement and control impulses. With the right understanding and support, many children with ADHD do remarkably well.",
myth:"The child is lazy or badly behaved and just needs stricter discipline.",
fact:"The difficulty is in the brain, not in character. Punishment alone doesn't fix it; routine, positive reinforcement and the right treatment make a clear difference.",
fam:`<h3>For families: understanding without blame</h3>
<p>All children fidget and daydream sometimes. Here, symptoms last at least six months, appear at home and at school, and get in the way of daily life.</p>
<ul><li><b>Inattention:</b> forgetful, loses things, leaves tasks unfinished, seems not to listen.</li><li><b>Hyperactivity:</b> can't stay seated, fidgets, talks a lot.</li><li><b>Impulsivity:</b> blurts out answers, interrupts, struggles to wait their turn.</li></ul>
<p>Girls often show quiet inattention without hyperactivity, so it is noticed later.</p>
<h4>What helps at home</h4>
<ul class="checklist"><li>A steady routine for sleep, meals and homework. <a href="/play/#schedule">My day</a> makes it visible.</li><li>Short instructions with eye contact, one request at a time.</li><li>Break big tasks into small steps, with movement breaks every 15–20 minutes.</li><li>Praise good behaviour straight away and specifically: "Well done, you finished the whole page."</li><li>Cut screen time, especially before bed; poor sleep makes symptoms worse.</li><li>When anger rises: one minute of the <a href="/play/#breath">breathing bubble</a> before talking.</li></ul>
<h4>About medication</h4>
<p>Medication is a medical decision made after a full assessment, with regular follow-up. For many children it is safe and effective under medical supervision. Discuss it with your doctor rather than relying on other people's experiences.</p>
<h4>When to book a consultation</h4><p>If school complaints are constant, attention problems affect learning or friendships, or you want to discuss treatment options.</p>`,
tea:`<h3>For teachers: from chaos to focus</h3>
<h4>In the classroom</h4>
<ul class="checklist"><li>Seat the student near the teacher, away from windows and the door.</li><li>Allow structured movement: handing out papers, wiping the board, fetching something.</li><li>Break classwork into short chunks with a quick check after each.</li><li>Write instructions on the board as well as saying them.</li><li>Agree a private signal to regain attention instead of calling out in front of the class.</li></ul>
<h4>The daily report card</h4>
<p>A simple home–school card with only two or three goals (e.g. "finished classwork", "waited for my turn"). The teacher rates it daily and parents reward at home. It is one of the most effective school tools for ADHD.</p>
<h4>What to avoid</h4>
<ul><li>Embarrassing the student in front of the class, or taking away break as punishment; they need the movement.</li><li>Labelling the student as lazy or rude.</li></ul>`,
res:`<h3>For researchers and specialists</h3>
<div class="stat-row"><div class="stat"><b>~5.3%</b><span>pooled worldwide prevalence in children and adolescents (Polanczyk 2007)</span></div><div class="stat"><b>≥ 6</b><span>symptoms in either domain (5 from age 17)</span></div><div class="stat"><b>&lt; 12</b><span>age of symptom onset in DSM-5-TR</span></div></div>
<h4>Diagnosis</h4>
<ul><li>DSM-5-TR: symptoms for at least six months, in two or more settings, with clear functional impairment.</li><li>Presentations: predominantly inattentive, predominantly hyperactive-impulsive, or combined.</li><li>Assess co-occurring learning disorders, anxiety, conduct and sleep problems, and autism.</li></ul>
<h4>Assessment tools</h4>
<ul><li>Vanderbilt or SNAP-IV rating scales, from both parents and teachers.</li></ul>
<h4>Evidence-based treatment</h4>
<ul><li>Ages 4–5: behavioural parent training is first-line.</li><li>From age 6: medication combined with behavioural intervention and school support.</li><li>Methylphenidate is the preferred first choice in children and adolescents in network meta-analysis (Cortese 2018).</li></ul>
<div class="collab"><b>Local research gap:</b> studies of ADHD prevalence in the Kurdistan Region, and validated Kurdish versions of rating scales, remain limited.</div>
