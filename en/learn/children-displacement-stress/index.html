<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"دعم الأطفال في ظروف النزوح والضغوط الشديدة | د. سالي رزقو","title":"دعم الأطفال في ظروف النزوح والضغوط الشديدة","sum":"ما الذي يلاحظه الأهل عند الأطفال بعد الصدمات والفقد والنزوح، وكيف نعيد إليهم الشعور بالأمان.","body":"<p>الأطفال الذين عاشوا النزوح أو العنف أو الفقد قد يعبّرون عن ضغطهم بطرق مختلفة عن الكبار. معظمهم يتعافى بشكل طبيعي حين يجدون <b>الأمان والروتين وراشدًا يطمئنون إليه</b>.</p><h3>ردود فعل شائعة</h3><ul><li><b>الصغار:</b> تعلّق شديد بالأهل، عودة إلى سلوك أصغر من عمرهم (التبول الليلي، مص الإصبع)، بكاء وخوف من الانفصال.</li><li><b>الأطفال الأكبر:</b> كوابيس، صعوبة في النوم، غضب أو عدوانية، صعوبة في التركيز، شكاوى جسدية.</li><li><b>المراهقون:</b> انسحاب، حزن، سلوك محفوف بالمخاطر، فقدان الاهتمام بالدراسة.</li></ul><p>هذه ردود فعل طبيعية على وضع غير طبيعي. وتستدعي المساعدة المتخصصة حين تشتد أو تستمر لأسابيع وتعيق حياة الطفل.</p><h3>ما الذي يساعد؟</h3><ul><li><b>الأمان أولًا:</b> بيئة قدر الإمكان مستقرة وآمنة، وقرب الأهل.</li><li><b>روتين يومي:</b> مواعيد ثابتة للنوم والأكل واللعب تعيد الإحساس بالسيطرة.</li><li><b>الاستماع دون إجبار:</b> اسمحوا له بالحديث حين يريد، ولا تضغطوا عليه ليروي ما حدث.</li><li><b>إجابات صادقة وبسيطة</b> تناسب عمره، دون تفاصيل مخيفة.</li><li><b>اللعب والرسم والأنشطة الجماعية:</b> وسيلة طبيعية للتعبير وتفريغ التوتر.</li><li><b>العودة إلى التعليم</b> قدر الإمكان لأنه يعيد النظام والأصدقاء.</li><li><b>رعاية الأهل أنفسهم:</b> الأهل الهادئون الأكثر قدرة على طمأنة أطفالهم.</li></ul><h3>متى أطلب المساعدة؟</h3><p>إذا استمرت الكوابيس أو الخوف الشديد أو الانسحاب أو التراجع في السلوك لأكثر من بضعة أسابيع، أو ظهرت أي أفكار لإيذاء النفس، فاطلبوا استشارة مختص.</p><p>شاركت الدكتورة سالي مع منظمات المجتمع المدني في زيارات لمخيمات المهجّرين والنازحين، وتقدّم الاستشارة للأسر عن بُعد أينما كانت.</p>"},"en":{"pageTitle":"Supporting children through displacement and severe stress | Dr. Sally Rizqo","title":"Supporting children through displacement and severe stress","sum":"What parents may notice in children after trauma, loss and displacement, and how to bring back a sense of safety.","body":"<p>Children who have lived through displacement, violence or loss may show their stress differently from adults. Most recover naturally when they have <b>safety, routine and an adult they trust</b>.</p><h3>Common reactions</h3><ul><li><b>Young children:</b> clinging to parents, going back to younger behaviour (bedwetting, thumb-sucking), crying and fear of separation.</li><li><b>Older children:</b> nightmares, trouble sleeping, anger or aggression, poor concentration, physical complaints.</li><li><b>Teenagers:</b> withdrawal, sadness, risky behaviour, losing interest in school.</li></ul><p>These are natural reactions to an unnatural situation. Specialist help is needed when they are intense or last for weeks and get in the way of the child's life.</p><h3>What helps</h3><ul><li><b>Safety first:</b> as stable and safe a setting as possible, with parents close.</li><li><b>Daily routine:</b> fixed times for sleep, meals and play restore a sense of control.</li><li><b>Listening without forcing:</b> let them talk when they want, and don't pressure them to tell what happened.</li><li><b>Honest, simple answers</b> suited to their age, without frightening detail.</li><li><b>Play, drawing and group activities:</b> a natural way to express and release tension.</li><li><b>Returning to education</b> as soon as possible, which brings back structure and friends.</li><li><b>Caring for parents too:</b> calm parents are best able to reassure their children.</li></ul><h3>When to seek help</h3><p>If nightmares, intense fear, withdrawal or regression last more than a few weeks, or any thoughts of self-harm appear, seek a specialist consultation.</p><p>Dr. Sally has taken part, with civil-society organisations, in visits to camps for displaced families, and offers consultations to families remotely wherever they are.</p>"}},
