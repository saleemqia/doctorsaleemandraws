<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"طفلي مصاب بالتوحد: خطوات عملية في البيت | د. سالي رزقو","title":"طفلي مصاب بالتوحد: خطوات عملية في البيت","sum":"روتين مصوّر، تواصل بسيط، وتعامل هادئ مع الانهيار الحسي. أفكار يمكن تطبيقها منذ اليوم.","body":"<p>بعد التشخيص يسأل الأهل: «ماذا نفعل في البيت؟». الدعم الأهم لا يحتاج أدوات غالية، بل <b>ثباتًا وصبرًا وفهمًا لطريقة الطفل</b> في التعبير.</p><h3>1. روتين واضح ومصوّر</h3><p>كثير من الأطفال يرتاحون حين يعرفون ما سيحدث بعد ذلك. استخدموا صورًا بسيطة بترتيب اليوم (استيقاظ، فطور، مدرسة، لعب، نوم)، وأخبروه مسبقًا بأي تغيير. في صفحة <a href=\"/play/\">الألعاب والأنشطة</a> جدول يومي مصوّر قابل للطباعة.</p><h3>2. تواصل بأبسط الطرق</h3><ul><li>استخدموا جملًا قصيرة وواضحة، وأعطوه وقتًا ليجيب.</li><li>أضيفوا الإشارات والصور إذا كان الكلام محدودًا. هذا لا يؤخر الكلام، بل يدعمه.</li><li>سمّوا مشاعره: «أنت غاضب لأن اللعبة انكسرت».</li></ul><h3>3. الانهيار ليس تمردًا</h3><p>الانهيار الحسي (meltdown) يحدث حين يُرهق الضجيج أو الازدحام أو التغيير جهازَه العصبي. ليس سلوكًا لجذب الانتباه ولا عنادًا. في تلك اللحظة:</p><ul><li>قللوا الصوت والضوء والكلام، وابقوا قريبين وهادئين.</li><li>لا تناقشوا ولا تعاقبوا أثناء الانهيار، فالطفل لا يستطيع الاستماع حينها.</li><li>بعد أن يهدأ، تحدثوا ببساطة، وفكروا ما الذي أرهقه لتتجنبوه أو تهيئوه له.</li></ul><h3>4. ابنوا على اهتماماته</h3><p>إن أحب السيارات أو الأرقام أو الحيوانات، فاستخدموها للتعلم واللعب والتواصل. الاهتمام القوي نقطة قوة وليس مشكلة.</p><h3>5. اعتنوا بأنفسكم أيضًا</h3><p>إرهاق الأهل حقيقي. اطلبوا المساعدة من العائلة، وتواصلوا مع أهالٍ آخرين، ولا تترددوا في طلب إرشاد للأهل. دعمكم لأنفسكم جزء من دعمكم لطفلكم.</p><p>لا يوجد علاج «يشفي» التوحد، لكن الدعم المناسب يحسّن مهارات الطفل واستقلاليته وجودة حياته وحياة الأسرة.</p>"},"en":{"pageTitle":"My child is autistic: practical steps at home | Dr. Sally Rizqo","title":"My child is autistic: practical steps at home","sum":"A picture routine, simple communication and calm responses to sensory overload. Ideas you can use from today.","body":"<p>After a diagnosis parents ask, \"What do we do at home?\" The most helpful support needs no expensive tools, only <b>consistency, patience and an understanding of how your child communicates</b>.</p><h3>1. A clear, picture-based routine</h3><p>Many children feel calmer when they know what comes next. Use simple pictures for the order of the day (wake up, breakfast, school, play, sleep) and warn them ahead of any change. The <a href=\"/play/\">games & activities</a> page has a printable picture schedule.</p><h3>2. Communicate in the simplest way</h3><ul><li>Use short, clear sentences and give time to answer.</li><li>Add gestures and pictures if speech is limited. This does not delay speech, it supports it.</li><li>Name feelings: \"You're angry because the toy broke.\"</li></ul><h3>3. A meltdown is not defiance</h3><p>A sensory meltdown happens when noise, crowds or change overwhelm the nervous system. It is not attention-seeking or stubbornness. In the moment:</p><ul><li>Reduce sound, light and talking, and stay close and calm.</li><li>Don't argue or punish during a meltdown; your child cannot take it in.</li><li>Once calm, talk simply, and think about what overwhelmed them so you can avoid or prepare for it.</li></ul><h3>4. Build on their interests</h3><p>If they love cars, numbers or animals, use them for learning, play and connection. A strong interest is a strength, not a problem.</p><h3>5. Look after yourselves too</h3><p>Parent exhaustion is real. Ask family for help, connect with other parents, and don't hesitate to seek parent guidance. Supporting yourselves is part of supporting your child.</p><p>There is no treatment that \"cures\" autism, but the right support improves a child's skills, independence and quality of life, and the family's too.</p>"}},
