<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"الشاشات والنوم: كيف نضع حدودًا دون صراع؟ | د. سالي رزقو","title":"الشاشات والنوم: كيف نضع حدودًا دون صراع؟","sum":"أفكار عملية لتنظيم وقت الشاشة وتحسين نوم الأطفال والمراهقين.","body":"<p>الشاشات جزء من حياة أطفالنا، والمنع التام غير واقعي. الهدف <b>تنظيم الاستخدام</b> بحيث لا يأخذ مكان النوم واللعب والعلاقات.</p><h3>قواعد بسيطة تنجح</h3><ul><li><b>وقت ومكان محددان:</b> لا شاشات أثناء الطعام، ولا في غرفة النوم ليلًا.</li><li><b>إيقاف قبل النوم:</b> ساعة على الأقل قبل النوم بلا شاشات، فالضوء والمحتوى المثير يؤخران النوم.</li><li><b>جدول واضح متفق عليه</b> مسبقًا، مع تنبيه قبل النهاية («بعد 5 دقائق ننتهي»). الانتقال المفاجئ يشعل الغضب خاصة عند أطفال التوحد وADHD.</li><li><b>محتوى مناسب للعمر</b> ومشاهدة مشتركة كلما أمكن، والحديث عما يشاهدونه.</li><li><b>القدوة:</b> الأطفال يقلدون استخدامنا نحن للهاتف.</li></ul><h3>النوم</h3><ul><li>موعد نوم واستيقاظ ثابت قدر الإمكان، حتى في العطلة.</li><li>روتين مهدّئ: حمّام، قصة، إضاءة خافتة.</li><li>غرفة هادئة ومظلمة وباردة نسبيًا.</li><li>تقليل الكافيين (المشروبات الغازية والطاقة) بعد الظهر.</li></ul><h3>ملاحظة</h3><p>قلة النوم تزيد التهيج وضعف التركيز وتفاقم أعراض ADHD والقلق. وإذا استمرت مشاكل النوم رغم التنظيم، أو كانت الشاشات مصدر صراع شديد أو تحل محل الأصدقاء والدراسة، فاستشيروا مختصًا.</p>"},"en":{"pageTitle":"Screens and sleep: setting limits without a battle | Dr. Sally Rizqo","title":"Screens and sleep: setting limits without a battle","sum":"Practical ideas for managing screen time and improving sleep in children and teenagers.","body":"<p>Screens are part of our children's lives and a total ban is unrealistic. The aim is to <b>regulate use</b> so it does not take the place of sleep, play and relationships.</p><h3>Simple rules that work</h3><ul><li><b>Set times and places:</b> no screens at meals, and none in the bedroom at night.</li><li><b>Switch off before bed:</b> at least an hour screen-free before sleep, as light and stimulating content delay sleep.</li><li><b>A clear schedule agreed in advance</b>, with a warning before it ends (\"five more minutes\"). Sudden transitions trigger anger, especially in autistic children and children with ADHD.</li><li><b>Age-appropriate content</b> and watching together when possible, talking about what they watch.</li><li><b>Role-modelling:</b> children copy how we use our own phones.</li></ul><h3>Sleep</h3><ul><li>A steady bedtime and wake time as far as possible, even on holidays.</li><li>A calming routine: bath, story, dim lights.</li><li>A quiet, dark and relatively cool room.</li><li>Less caffeine (fizzy and energy drinks) after midday.</li></ul><h3>Note</h3><p>Too little sleep increases irritability and poor concentration and worsens ADHD and anxiety symptoms. If sleep problems continue despite a routine, or screens are a source of intense conflict or replace friends and schoolwork, speak to a specialist.</p>"}},
