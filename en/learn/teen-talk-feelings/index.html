<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"كيف أتحدث مع ابني المراهق عن مشاعره؟ | د. سالي رزقو","title":"كيف أتحدث مع ابني المراهق عن مشاعره؟","sum":"الاستماع قبل النصيحة، واختيار الوقت المناسب، وما الذي يغلق باب الحوار.","body":"<p>كثير من الأهل يقولون: «لم يعد يحدثني». هذا شائع في المراهقة، فالمراهق يبحث عن استقلاله وخصوصيته. لكنه ما زال يحتاج إلى أهله، بشكل مختلف.</p><h3>ما الذي يفتح الباب؟</h3><ul><li><b>الوقت المناسب:</b> الحديث يأتي أسهل أثناء نشاط مشترك (سيارة، مشي، طبخ) أكثر من جلسة مواجهة وجهًا لوجه.</li><li><b>الاستماع أولًا:</b> دعوه يكمل دون مقاطعة أو نصيحة فورية. أحيانًا يريد أن يُسمَع فقط.</li><li><b>تسمية المشاعر دون حكم:</b> «يبدو أنك محبط». لا تقولوا «ليس هناك سبب لتحزن».</li><li><b>أسئلة مفتوحة:</b> «ما أصعب شيء في يومك؟» أفضل من «هل كان يومك جيدًا؟».</li><li><b>احترام الخصوصية:</b> لا تفتشوا أغراضه، واشرحوا حدودكم الأمنية بوضوح وهدوء.</li></ul><h3>ما الذي يغلق الباب؟</h3><ul><li>السخرية أو التقليل من مشكلته («هذه مشكلة تافهة»).</li><li>المقارنة بإخوته أو بأقرانه.</li><li>المحاضرات الطويلة أو استخدام ما قاله ضده لاحقًا.</li><li>الذعر أو الغضب الشديد حين يخبركم بشيء صعب.</li></ul><h3>متى أطلب المساعدة؟</h3><p>انتبهوا إذا استمر لأسابيع: انسحاب من الأصدقاء والأنشطة، تغيّر في النوم أو الأكل، تراجع دراسي واضح، حزن أو غضب شديد، أو حديث عن اليأس أو إيذاء النفس. في هذه الحالات لا تنتظروا، وتحدثوا مع مختص. وإذا ذكر المراهق رغبة في إيذاء نفسه، فتعاملوا معها بجدية فورًا واطلبوا مساعدة طبية عاجلة.</p>"},"en":{"pageTitle":"How do I talk to my teenager about their feelings? | Dr. Sally Rizqo","title":"How do I talk to my teenager about their feelings?","sum":"Listening before advising, choosing the right moment, and what shuts the conversation down.","body":"<p>Many parents say, \"They don't talk to me any more.\" That is common in adolescence, as teens seek independence and privacy. But they still need their parents, in a different way.</p><h3>What opens the door</h3><ul><li><b>The right moment:</b> talking is easier during a shared activity (car ride, walk, cooking) than in a face-to-face sit-down.</li><li><b>Listen first:</b> let them finish without interrupting or giving instant advice. Sometimes they just want to be heard.</li><li><b>Name feelings without judging:</b> \"It sounds like you're frustrated.\" Avoid \"There's no reason to be sad.\"</li><li><b>Open questions:</b> \"What was the hardest part of your day?\" works better than \"Was your day good?\"</li><li><b>Respect privacy:</b> don't search their things, and explain your safety limits clearly and calmly.</li></ul><h3>What shuts the door</h3><ul><li>Mocking or minimising their problem (\"that's nothing\").</li><li>Comparing them with siblings or peers.</li><li>Long lectures, or using what they told you against them later.</li><li>Panic or strong anger when they tell you something difficult.</li></ul><h3>When to seek help</h3><p>Watch for these lasting weeks: withdrawing from friends and activities, changes in sleep or eating, a clear drop in school performance, intense sadness or anger, or talk of hopelessness or self-harm. In these cases don't wait, and speak to a specialist. If a teenager mentions wanting to harm themselves, take it seriously straight away and seek urgent medical help.</p>"}},
