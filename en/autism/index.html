ar:{
pageTitle:"التوحد | د. سالي رزقو",
title:"التوحد",
lead:"اختلاف في طريقة نمو الدماغ يؤثر على التواصل والتفاعل الاجتماعي والسلوك. ليس مرضًا يُشفى منه، لكن الدعم المبكر يصنع فرقًا حقيقيًا في حياة الطفل والأسرة.",
myth:"التوحد سببه التربية الخاطئة أو قلة اهتمام الأم.",
fact:"التوحد حالة نمائية لها أساس وراثي وعصبي قوي. الأهل ليسوا السبب، لكنهم أهم جزء من الحل.",
fam:`<h3>للعائلات: من الملاحظة إلى الخطوة الأولى</h3>
<p>كل طفل يتطور بسرعته الخاصة، ووجود علامة واحدة لا يعني التوحد. لكن راجعوا مختصًا إذا لاحظتم:</p>
<ul><li>قلة النظر في العين، أو عدم الاستجابة لاسمه في عمر سنة تقريبًا.</li><li>عدم الإشارة إلى الأشياء ليُريكم ما يهمه في عمر 14 شهرًا تقريبًا.</li><li>عدم نطق كلمات مفردة في عمر 16 شهرًا، أو جمل من كلمتين في عمر سنتين.</li><li>حركات متكررة كرفرفة اليدين أو الدوران، أو ترتيب الأشياء في صفوف.</li><li>انزعاج شديد من تغيير الروتين، أو حساسية غير عادية للأصوات والملمس.</li></ul>
<div class="alert">فقدان أي مهارة لغوية أو اجتماعية كان قد اكتسبها، في أي عمر، يستدعي التقييم دون تأخير.</div>
<h4>ماذا تفعلون الآن؟</h4>
<ol><li>دوّنوا ملاحظاتكم مع أمثلة وتواريخ، وصوّروا مقاطع قصيرة لسلوك الطفل في البيت.</li><li>لا تنتظروا «حتى يكبر». التقييم المبكر لا يضر، والانتظار يضيّع وقتًا ثمينًا.</li><li>اطلبوا فحص السمع، فضعف السمع قد يشبه بعض علامات التوحد.</li><li>احذروا من أي جهة تعد بـ«علاج التوحد» أو «الشفاء التام». هذه وعود غير علمية، وبعضها مكلف ومؤذٍ.</li></ol>
<h4>في البيت كل يوم</h4>
<ul class="checklist"><li>العبوا على مستوى عينيه: قلّدوا حركاته وأصواته، واتبعوا اهتمامه.</li><li>تكلموا بجمل قصيرة وواضحة، وانتظروا ردّه بصبر.</li><li>استخدموا الصور لتوضيح الروتين: <a href="/en/play/#schedule">جدولي اليومي</a> يساعد على ذلك.</li><li>نبّهوه قبل أي تغيير: «بعد خمس دقائق نذهب للحمّام».</li><li>احتفلوا بالخطوات الصغيرة، فهي التي تبني التقدم.</li></ul>
<h4>متى تحجزون استشارة؟</h4><p>إذا كانت لديكم مخاوف حول تواصل طفلكم أو سلوكه، أو تريدون رأيًا ثانيًا في تشخيص سابق، أو خطة عملية للبيت والمدرسة.</p>`,
tea:`<h3>للمعلمين: صفّ يناسب الجميع</h3>
<p>الطالب المصاب بالتوحد يتعلم بشكل أفضل حين يكون اليوم متوقعًا، والتعليمات واضحة، والبيئة هادئة.</p>
<h4>داخل الصف</h4>
<ul class="checklist"><li>جدول مصوّر لروتين اليوم على الحائط أو على طاولة الطالب.</li><li>نبّهوا الطالب قبل أي تغيير في الجدول أو المكان.</li><li>تعليمات قصيرة، واحدة في كل مرة، مع إشارة أو صورة.</li><li>ركن هادئ يلجأ إليه الطالب عند الضغط الحسي، دون أن يُعتبر عقابًا.</li><li>استخدموا اهتماماته الخاصة مدخلًا للتعلم.</li></ul>
<h4>التواصل مع الأهل</h4>
<ul><li>شاركوا ملاحظاتكم بلطف ودون تشخيص: «لاحظتُ أن…» بدل «ابنكم عنده…».</li><li>اقترحوا مراجعة مختص، ووضّحوا أن الهدف هو دعم الطفل.</li><li>دفتر تواصل يومي بسيط بين البيت والمدرسة يقلل سوء الفهم.</li></ul>
<h4>الدمج والتنمّر</h4>
<p>علّموا الصف أن الاختلاف طبيعي، وراقبوا الاستراحات والأماكن غير المنظمة، فهي أكثر الأوقات التي يتعرض فيها الطالب للعزلة أو التنمر.</p>`,
res:`<h3>للباحثين والمختصين</h3>
<div class="stat-row"><div class="stat"><b>~1 / 100</b><span>طفل حول العالم (تقدير منظمة الصحة العالمية)</span></div><div class="stat"><b>1 / 31</b><span>طفل بعمر 8 سنوات في الولايات المتحدة، بيانات 2022 (CDC 2025)</span></div><div class="stat"><b>~3 : 1</b><span>نسبة الذكور إلى الإناث (Loomes 2017)</span></div></div>
<h4>التشخيص</h4>
<ul><li>معايير DSM-5-TR: صعوبات مستمرة في التواصل والتفاعل الاجتماعي، مع أنماط سلوك أو اهتمامات مقيدة ومتكررة، تظهر في مرحلة نمو مبكرة وتسبب أثرًا وظيفيًا واضحًا.</li><li>استبعدوا ضعف السمع واضطرابات اللغة والإعاقة الذهنية المنفردة.</li><li>الحالات المصاحبة الشائعة: فرط الحركة، القلق، الصرع، اضطرابات النوم والجهاز الهضمي.</li></ul>
<h4>أدوات الفحص</h4>
<ul><li><span class="ltr">M-CHAT-R/F</span>: فحص روتيني في عمر 18 و24 شهرًا.</li><li><span class="ltr">ADOS-2</span> و<span class="ltr">ADI-R</span>: أدوات تقييم تشخيصي معيارية.</li></ul>
<h4>التدخلات المدعومة بالأدلة</h4>
<ul><li>التدخلات السلوكية النمائية الطبيعية (NDBI) وبرامج تدريب الأهل.</li><li>علاج النطق واللغة، والعلاج الوظيفي.</li><li>لا يوجد دواء يعالج التوحد نفسه، لكن الأدوية قد تُستخدم للحالات المصاحبة.</li></ul>
<div class="collab"><b>فجوة بحثية محلية:</b> البيانات المحلية عن انتشار التوحد في إقليم كوردستان محدودة، وكذلك النسخ المعتمدة بالكوردية (البادينية) من أدوات الفحص.</div>
<h4>{refsTitle}</h4>
<ol class="refs ltr">
<li>Hyman SL, Levy SE, Myers SM; AAP Council on Children With Disabilities. Identification, evaluation, and management of children with autism spectrum disorder. <i>Pediatrics</i>. 2020;145(1):e20193447. <a href="https://doi.org/10.1542/peds.2019-3447">doi</a></li>
<li>Robins DL, et al. Validation of the M-CHAT-R/F. <i>Pediatrics</i>. 2014;133(1):37–45. <a href="https://doi.org/10.1542/peds.2013-1813">doi</a></li>
<li>Lord C, et al. The Lancet Commission on the future of care and clinical research in autism. <i>Lancet</i>. 2022;399:271–334. <a href="https://doi.org/10.1016/S0140-6736(21)01541-5">doi</a></li>
<li>Shaw KA, et al. Prevalence and early identification of autism spectrum disorder among children aged 4 and 8 years. <i>MMWR Surveill Summ</i>. 2025;74(SS-2). <a href="https://doi.org/10.15585/mmwr.ss7402a1">doi</a></li>
<li>Sandbank M, et al. Project AIM: Autism intervention meta-analysis for studies of young children. <i>Psychol Bull</i>. 2020;146(1):1–29. <a href="https://doi.org/10.1037/bul0000215">doi</a></li>
<li>Loomes R, Hull L, Mandy WPL. What is the male-to-female ratio in autism spectrum disorder? <i>J Am Acad Child Adolesc Psychiatry</i>. 2017;56(6):466–474. <a href="https://doi.org/10.1016/j.jaac.2017.03.013">doi</a></li>
<li>NICE. Autism spectrum disorder in under 19s: recognition, referral and diagnosis (CG128). <a href="https://www.nice.org.uk/guidance/cg128">nice.org.uk</a></li>
<li>WHO. Autism fact sheet. <a href="https://www.who.int/news-room/fact-sheets/detail/autism-spectrum-disorders">who.int</a></li>
</ol>`

en:{
pageTitle:"Autism | Dr. Sally Rizqo",
title:"Autism",
lead:"A difference in how the brain develops that affects communication, social interaction and behaviour. It is not a disease to be cured, but early support makes a real difference to the child and the whole family.",
myth:"Autism is caused by poor parenting or a cold mother.",
fact:"Autism is a developmental condition with strong genetic and neurological roots. Parents are not the cause, but they are the most important part of the support.",
fam:`<h3>For families: from noticing to the first step</h3>
<p>Every child develops at their own pace, and one sign alone does not mean autism. Talk to a specialist if you notice:</p>
<ul><li>Little eye contact, or not responding to their name by around 12 months.</li><li>Not pointing to show you things of interest by around 14 months.</li><li>No single words by 16 months, or no two-word phrases by 24 months.</li><li>Repetitive movements such as hand-flapping or spinning, or lining objects up.</li><li>Strong distress at changes in routine, or unusual sensitivity to sounds or textures.</li></ul>
<div class="alert">Loss of any language or social skill your child already had, at any age, needs assessment without delay.</div>
<h4>What to do now</h4>
<ol><li>Write down what you notice, with examples and dates. Short home videos help a lot.</li><li>Don't "wait and see". An early assessment does no harm; waiting loses valuable time.</li><li>Ask for a hearing test, since hearing problems can look like some signs of autism.</li><li>Be wary of anyone promising to "cure" autism. These claims are not scientific, and some are costly or harmful.</li></ol>
<h4>Every day at home</h4>
<ul class="checklist"><li>Play at their eye level: copy their movements and sounds, and follow their interests.</li><li>Use short, clear sentences, and wait patiently for a response.</li><li>Use pictures to show the routine: <a href="/en/play/#schedule">My day</a> helps with this.</li><li>Give warning before changes: "In five minutes, it's bath time."</li><li>Celebrate small steps; they are what progress is made of.</li></ul>
<h4>When to book a consultation</h4><p>If you have concerns about your child's communication or behaviour, want a second opinion on an earlier diagnosis, or need a practical plan for home and school.</p>`,
tea:`<h3>For teachers: a classroom that works for everyone</h3>
<p>Autistic students learn best when the day is predictable, instructions are clear and the environment is calm.</p>
<h4>In the classroom</h4>
<ul class="checklist"><li>A visual timetable of the day, on the wall or on the student's desk.</li><li>Give warning before any change of schedule or room.</li><li>Short instructions, one at a time, with a gesture or picture.</li><li>A quiet corner for moments of sensory overload, never used as punishment.</li><li>Use the student's special interests as a way into learning.</li></ul>
<h4>Talking with parents</h4>
<ul><li>Share observations gently, without diagnosing: "I've noticed that…" rather than "Your child has…".</li><li>Suggest a specialist review, and make clear the aim is to support the child.</li><li>A simple daily home–school notebook reduces misunderstandings.</li></ul>
<h4>Inclusion and bullying</h4>
<p>Teach the class that difference is normal, and watch breaks and unstructured spaces, where isolation and bullying happen most.</p>`,
res:`<h3>For researchers and specialists</h3>
<div class="stat-row"><div class="stat"><b>~1 / 100</b><span>children worldwide (WHO estimate)</span></div><div class="stat"><b>1 / 31</b><span>8-year-olds in the US, 2022 data (CDC, 2025)</span></div><div class="stat"><b>~3 : 1</b><span>male-to-female ratio (Loomes 2017)</span></div></div>
<h4>Diagnosis</h4>
<ul><li>DSM-5-TR: persistent deficits in social communication and interaction, plus restricted, repetitive patterns of behaviour or interests, present early in development and causing clear functional impact.</li><li>Rule out hearing loss, language disorders and isolated intellectual disability.</li><li>Common co-occurring conditions: ADHD, anxiety, epilepsy, sleep and gastrointestinal problems.</li></ul>
<h4>Screening and assessment tools</h4>
<ul><li>M-CHAT-R/F: routine screening at 18 and 24 months.</li><li>ADOS-2 and ADI-R: standardised diagnostic assessment.</li></ul>
<h4>Evidence-based interventions</h4>
<ul><li>Naturalistic developmental behavioural interventions (NDBI) and parent-mediated programmes.</li><li>Speech and language therapy, occupational therapy.</li><li>No medication treats autism itself; medication may be used for co-occurring conditions.</li></ul>
<div class="collab"><b>Local research gap:</b> local prevalence data for the Kurdistan Region are limited, as are validated Kurdish (Badini) versions of screening tools.</div>
<h4>{refsTitle}</h4>
<ol class="refs">
<li>Hyman SL, Levy SE, Myers SM; AAP Council on Children With Disabilities. Identification, evaluation, and management of children with autism spectrum disorder. <i>Pediatrics</i>. 2020;145(1):e20193447. <a href="https://doi.org/10.1542/peds.2019-3447">doi</a></li>

<li>Shaw KA, et al. Prevalence and early identification of autism spectrum disorder among children aged 4 and 8 years. <i>MMWR Surveill Summ</i>. 2025;74(SS-2). <a href="https://doi.org/10.15585/mmwr.ss7402a1">doi</a></li>
<li>Sandbank M, et al. Project AIM: Autism intervention meta-analysis for studies of young children. <i>Psychol Bull</i>. 2020;146(1):1–29. <a href="https://doi.org/10.1037/bul0000215">doi</a></li>
