<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"علامات التوحد المبكرة: متى يجب أن أقلق؟ | د. سالي رزقو","title":"علامات التوحد المبكرة: متى يجب أن أقلق؟","sum":"ما الذي يلاحظه الأهل في السنتين الأوليين، ومتى يكون التقييم ضروريًا، ولماذا لا ينبغي الانتظار.","body":"<p>كل طفل يتطور بإيقاعه الخاص، ووجود علامة واحدة لا يعني أن الطفل مصاب بالتوحد. الأهم أن ننتبه إلى <b>مجموعة علامات تستمر</b> وتؤثر على تواصل الطفل ولعبه وتفاعله مع من حوله.</p><h3>علامات يلاحظها الأهل</h3><ul><li>قلة التواصل بالعين، أو عدم الالتفات عند مناداته باسمه في عمر سنة تقريبًا.</li><li>عدم الإشارة بإصبعه إلى الأشياء ليُريكم ما يهمه، أو عدم الاستجابة لإشارتكم.</li><li>تأخر الكلام أو غياب المناغاة، أو التوقف عن كلمات كان يقولها.</li><li>لعب متكرر بنفس الطريقة (ترتيب الأشياء، تدوير العجلات) أكثر من اللعب التخيلي.</li><li>حساسية شديدة لأصوات أو ملمس أو روائح معينة، أو انزعاج كبير من تغيّر الروتين.</li><li>قلة الاهتمام بمشاركة الفرح معكم أو بمشاهدة الأطفال الآخرين.</li></ul><div class=\"alert\">فقدان أي مهارة لغوية أو اجتماعية كان الطفل قد اكتسبها، في أي عمر، يستدعي التقييم دون تأخير.</div><h3>ما الذي لا يعني التوحد وحده؟</h3><p>الخجل، أو تأخر الكلام وحده مع تواصل جيد بالإشارات والنظر، أو اللعب الهادئ لا تعني بالضرورة التوحد. لذلك نحتاج إلى تقييم متخصص يجمع الملاحظات من البيت ومن المدرسة أو الحضانة.</p><h3>ماذا أفعل الآن؟</h3><ol><li>دوّنوا ملاحظاتكم مع أمثلة وتواريخ، وصوّروا مقاطع قصيرة لسلوك الطفل في البيت.</li><li>اطلبوا فحص السمع وتقييم النمو، فهما من أول الخطوات.</li><li>لا تنتظروا «حتى يكبر». الدعم المبكر يحسّن التواصل والمهارات في سنوات يكون فيها الدماغ شديد المرونة.</li><li>تواصلوا مع مختص في صحة الطفل النفسية والنمائية لتقييم الحالة ووضع خطة.</li></ol><p>طلب التقييم ليس اتهامًا لأحد ولا حكمًا على الطفل، بل خطوة محبة لفهمه ودعمه. والأهل ليسوا سبب التوحد.</p>"},"en":{"pageTitle":"Early signs of autism: when should I be concerned? | Dr. Sally Rizqo","title":"Early signs of autism: when should I be concerned?","sum":"What parents may notice in the first two years, when an assessment is worth seeking, and why waiting is rarely helpful.","body":"<p>Every child develops at their own pace, and a single sign does not mean a child is autistic. What matters is a <b>pattern that persists</b> and affects how the child communicates, plays and connects with others.</p><h3>Signs parents may notice</h3><ul><li>Little eye contact, or not turning when called by name at around one year.</li><li>Not pointing to show you things that interest them, or not following your pointing.</li><li>Delayed speech, little babbling, or stopping words they used to say.</li><li>Repetitive play (lining up objects, spinning wheels) more than pretend play.</li><li>Strong reactions to certain sounds, textures or smells, or great distress when routines change.</li><li>Little interest in sharing joy with you or watching other children.</li></ul><div class=\"alert\">Losing any language or social skill a child had already gained, at any age, calls for assessment without delay.</div><h3>What does not point to autism on its own?</h3><p>Shyness, or late talking alone with good communication through gestures and eye contact, or quiet play do not necessarily mean autism. That is why a specialist assessment, bringing together observations from home and from nursery or school, is needed.</p><h3>What can I do now?</h3><ol><li>Write down your observations with examples and dates, and record short videos of your child at home.</li><li>Ask for a hearing test and a developmental assessment. They are among the first steps.</li><li>Don't wait for them to \"grow out of it\". Early support improves communication and skills during years when the brain is very adaptable.</li><li>Contact a specialist in child mental health and development to assess your child and agree a plan.</li></ol><p>Asking for an assessment is not blaming anyone or judging your child. It is a loving step towards understanding and supporting them. Parents do not cause autism.</p>"}},
