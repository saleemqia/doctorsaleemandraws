<script>
window.PAGE = { id:"learn", t:{"ar":{"pageTitle":"صعوبات التعلم: كيف أعرف أن طفلي يعاني منها؟ | د. سالي رزقو","title":"صعوبات التعلم: كيف أعرف أن طفلي يعاني منها؟","sum":"علامات القراءة والكتابة والحساب، والفرق بينها وبين الكسل أو قلة الذكاء.","body":"<p>صعوبات التعلم (مثل عسر القراءة وعسر الكتابة وعسر الحساب) تعني أن الطفل يواجه صعوبة محددة في مهارة أكاديمية <b>رغم ذكائه الطبيعي وتعليمه الجيد</b>. ليست كسلًا وليست قلة ذكاء.</p><h3>علامات محتملة</h3><ul><li><b>القراءة:</b> يخلط بين الحروف المتشابهة، يقرأ ببطء وبجهد، يخمّن الكلمات بدل قراءتها، ويتجنب القراءة بصوت عالٍ.</li><li><b>الكتابة:</b> أخطاء إملائية كثيرة وغير ثابتة، خط غير منظم، صعوبة في ترتيب الأفكار على الورق.</li><li><b>الحساب:</b> صعوبة في فهم الأعداد وحفظ جدول الضرب والعمليات، أو في مسائل الكلام.</li><li>يتعب بسرعة من الواجبات، ويقول «أنا غبي» أو يتجنب المدرسة.</li></ul><h3>لماذا التقييم مهم؟</h3><p>قد تتشابه علامات صعوبات التعلم مع ADHD أو القلق أو ضعف النظر والسمع. لذلك نبدأ بفحص النظر والسمع، ثم تقييم تعليمي ونفسي يحدد نقاط القوة والصعوبة بدقة.</p><h3>كيف ندعمه؟</h3><ul><li>تعليم مباشر ومنظم يركز على المهارة الضعيفة، بالتعاون مع المدرسة.</li><li>تسهيلات: وقت إضافي في الامتحانات، تقسيم المهام، استخدام وسائل مساعدة.</li><li>الإكثار من التشجيع وإبراز ما يتقنه، لحماية ثقته بنفسه.</li><li>القراءة معه بصوت عالٍ، وعدم مقارنته بإخوته.</li></ul><p>مع الدعم المبكر والمناسب يستطيع معظم الأطفال تحقيق تقدم كبير والنجاح في دراستهم.</p>"},"en":{"pageTitle":"Learning difficulties: how do I know if my child has one? | Dr. Sally Rizqo","title":"Learning difficulties: how do I know if my child has one?","sum":"Signs in reading, writing and maths, and how they differ from laziness or low intelligence.","body":"<p>Learning difficulties (such as dyslexia, dysgraphia and dyscalculia) mean a child struggles with a specific academic skill <b>despite normal intelligence and good teaching</b>. They are not laziness and not low intelligence.</p><h3>Possible signs</h3><ul><li><b>Reading:</b> mixes up similar letters, reads slowly and with effort, guesses words instead of reading them, avoids reading aloud.</li><li><b>Writing:</b> many inconsistent spelling errors, untidy handwriting, trouble organising ideas on paper.</li><li><b>Maths:</b> difficulty grasping numbers, learning times tables and operations, or with word problems.</li><li>Tires quickly with homework, says \"I'm stupid\" or avoids school.</li></ul><h3>Why assessment matters</h3><p>Signs can look like ADHD, anxiety, or poor sight or hearing. So we start with vision and hearing checks, then an educational and psychological assessment that pinpoints strengths and difficulties.</p><h3>How can we support them?</h3><ul><li>Direct, structured teaching focused on the weak skill, in partnership with school.</li><li>Accommodations: extra exam time, tasks broken down, assistive tools.</li><li>Lots of encouragement and highlighting what they do well, to protect their confidence.</li><li>Reading aloud together, and never comparing them with siblings.</li></ul><p>With early and appropriate support, most children make great progress and succeed in their studies.</p>"}},
