en:{
 pageTitle:"Resources | Dr. Sally Rizqo", kuDraft:"", h1:"Resources for parents, teachers and researchers", lead:"Practical, plain-language guides, printable tools and published evidence. Arabic, Kurdish, English.",
 tabP:"Parents", tabT:"Teachers", tabR:"Researchers",
 pTitle:"For parents", pLead:"Reassurance, plain explanations of terms, and steps you can try at home.",
 p1T:"Is this normal?", p1B:"<p>Tantrums, fears and withdrawal are common in childhood. What matters is <b>how intense, how often, how long and how much it affects daily life</b>. If it lasts for weeks, or stops your child from learning, playing or sleeping, talk to a specialist.</p>",
 p2T:"After a diagnosis", p2B:"<p>Start with a simple, age-appropriate explanation: “Your brain works a little differently, so some things are harder, and there are ways to help.” Avoid words that make a child feel guilty or flawed, and let them help choose the strategies.</p>",
 p3T:"Screens and attention", p3B:"<p>A systematic review (Santos et al., 2022) covered 11 studies of typically developing children. Most found an association between more screen time and attention problems. These links are <b>correlational</b> and do not prove cause. Practical step: set screen-free times before bed and at meals.</p>",
 p4T:"Calming big feelings at home", p4B:"<ul><li>Stay calm first: low voice, short sentences.</li><li>Name the feeling: “You’re angry because the toy broke.”</li><li>Offer a quiet space or slow breathing together.</li><li>Once calm, talk about what happened and what to try next time.</li></ul>",
 toolsT:"Printable tools", toolRedT:"“When to see a specialist” poster", toolRedB:"Clear signs that warrant a visit, with an emergency note.", toolTrkT:"Daily behaviour tracker", toolTrkB:"A log of what happened before a behaviour and what followed, to bring to the appointment.", openDoc:"Open and print (PDF) →",
 tTitle:"For teachers", tLead:"Teachers are often the first to notice signs. Simple tools make early referral more likely.",
 t1T:"The inclusive classroom", t1B:"<p>Small changes help a child with ADHD or autism without disrupting the rest of the class: a visual activity schedule, short step-by-step instructions, a calm break space, and advance warning before changes.</p>",
 t2T:"De-escalating in class", t2B:"<ul><li>Stay calm and speak quietly; reduce the audience.</li><li>Offer two simple choices instead of a command.</li><li>Don’t touch the child without permission; give space.</li><li>Afterwards: a quiet place, then a short talk with the child and then the family.</li></ul>",
 t3T:"Talking with parents", t3B:"<p>Start with what you observed, not a diagnosis: “I’ve noticed Omar has trouble finishing written tasks for a month, and sometimes leaves his seat. Do you see this at home?” Suggest a specialist visit without promising a diagnosis.</p>",
 t4T:"Attention or a learning difficulty?", t4B:"<p>Persistent inattention across all subjects and settings points more towards attention difficulties. A specific academic difficulty (such as reading or writing) with otherwise typical ability points more towards a learning difficulty. Telling them apart needs assessment, so keep dated notes.</p>",
 toolClsT:"“5 ways to support a struggling student” poster", toolClsB:"For the classroom or staff room wall.", toolObsT:"Behaviour observation form", toolObsB:"A short form to record behaviour by frequency and context, to share with Dr. Sally.",
 rTitle:"For researchers", rLead:"A space for academic collaboration. Anything published here is based on cited sources.",
 r1T:"Published studies", r1B:"<ul><li>Santos et al. (2022). <i>Developmental Neuropsychology</i> 47(4): 175–192. Systematic review: most studies link screen time to attention problems in typically developing children.</li><li>Samadi et al. (2022). <i>IJERPH</i> 19(8): 4581. Autism screening tool study in the Kurdistan Region; it does not report a population prevalence.</li></ul>",
 r2T:"Prevalence in Duhok and Kurdistan", r2B:"<p>We have not yet found a published study reporting a reliable prevalence rate for childhood disorders in Duhok. We will not publish figures until a reliable source is available.</p>",
 r3T:"Stigma and access to care", r3B:"<p>An open area: how stigma around child psychiatry affects the time families take to reach treatment. Collaboration on rigorous studies is welcome.</p>",
 r4T:"Outcomes of adapted therapies", r4B:"<p>A proposed area: measuring outcomes of behavioural and educational interventions adapted for Arabic- and Kurdish-speaking families, using translated and validated tools. Measures should be validated before data collection.</p>",
 rNote:"Note: patient data is not shared through this website. Any request for anonymised data is reviewed by Dr. Sally under the required ethical approvals.",
 rCollabT:"Research collaboration request", rCollabB:"If you have a joint study idea, send it on WhatsApp with the researcher’s name, institution and aim.", rCollabBtn:"Send a collaboration request", waMsgResearch:"Hello Dr. Sally, I have a proposal for a joint research study. Could we talk about it?",
}}};
