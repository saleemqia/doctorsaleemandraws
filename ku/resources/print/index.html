<style>
.sheet{background:#fff;color:#25364A;border:1px solid var(--line);border-radius:18px;padding:26px;max-width:800px;margin:16px auto;box-shadow:var(--shadow)}
.sheet h1{font-size:24px;margin:0 0 6px;color:#25364A}
.sheet .sub{color:#566B81;margin:0 0 14px}
.sheet ul{padding-inline-start:20px}
.sheet li{margin:6px 0;font-size:16px}
.sheet .emerg{background:#F5EBE9;color:#8F4F49;border-radius:12px;padding:12px 14px;font-weight:700;margin-top:14px}
.sheet .foot{color:#566B81;font-size:12.5px;margin-top:14px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.sheet th,.sheet td{border:1px solid #cfdbe6;padding:6px 7px;text-align:start;vertical-align:top;min-height:28px}
.sheet th{background:#E4F0FA}
.sheet .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}
.sheet .fields div{border-bottom:1px solid #9fb3c4;padding:14px 0 2px;color:#566B81;font-size:13px}
.bar{max-width:800px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar select{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
@media print{ .bar,.noprint{display:none!important} .sheet{box-shadow:none;border:0;margin:0;padding:0;max-width:none} body{background:#fff} @page{size:A4;margin:14mm} }

  let body = "";

    body = `<p>${esc(d.intro)}</p><ul>${d.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul><p class="emerg">${esc(d.emerg)}</p>`;
  } else if (d.id === "tracker"){
    body = `<p>${esc(d.intro)}</p><div class="fields">${d.fields.map(f => `<div>${esc(f)}</div>`).join("")}</div>
      <table><thead><tr>${d.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${Array.from({ length: d.rows }, () => `<tr>${d.cols.map(() => "<td style='height:30px'></td>").join("")}</tr>`).join("")}</tbody></table>`;
  } else if (d.id === "classroom"){
    body = `<ol style="font-size:17px;line-height:1.8">${d.items.map(i => `<li>${esc(i)}</li>`).join("")}</ol>`;
  } else if (d.id === "checklist"){
    body = `<p>${esc(d.intro)}</p><div class="fields">${d.fields.map(f => `<div>${esc(f)}</div>`).join("")}</div>

  sheet.innerHTML = `<h1>${esc(d.title)}</h1>${sub}${body}<p class="foot">${esc(d.foot)}</p>`;

}
