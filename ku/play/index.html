/* ===== Games ===== */
const Games = (() => {
  const L = k => window.tx(k);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* 1. Feelings match: 6 rounds, 3 faces each, no timer, wrong answers just fade. */
  const FACES = { happy:"😊", sad:"😢", angry:"😠", scared:"😨", surprised:"😲", calm:"😌" };
  let emoQueue = [], emoTarget = null, emoStars = 0, emoChoices = [];
  function emoNew(){ emoQueue = shuffle(Object.keys(FACES)); emoStars = 0; emoNext(); }
  function emoNext(){
    document.getElementById("emo-feedback").textContent = "";
    document.getElementById("emo-stars").textContent = "⭐".repeat(emoStars);
    if (!emoQueue.length){ emoTarget = null; document.getElementById("emo-prompt").textContent = L("emoDone"); document.getElementById("emo-choices").innerHTML = ""; return; }
    emoTarget = emoQueue.pop();
    const others = shuffle(Object.keys(FACES).filter(k => k !== emoTarget)).slice(0, 2);
    emoChoices = shuffle([emoTarget, ...others]);
    emoRender();
  }
  function emoRender(){
    if (!emoTarget) { if (emoStars) document.getElementById("emo-prompt").textContent = L("emoDone"); return; }
    document.getElementById("emo-prompt").innerHTML = L("emoPrompt").replace("{x}", L("feelings")[emoTarget]);
    const box = document.getElementById("emo-choices"); box.innerHTML = "";
    emoChoices.forEach(k => {
      const b = document.createElement("button"); b.className = "choice"; b.textContent = FACES[k];
      b.setAttribute("aria-label", L("feelings")[k]);
      b.onclick = () => {
        if (b.disabled) return;
        if (k === emoTarget){
          b.classList.add("right"); box.querySelectorAll("button").forEach(x => x.disabled = true);
          emoStars++; const r = L("emoRight"); document.getElementById("emo-feedback").textContent = r[Math.floor(Math.random() * r.length)];
          document.getElementById("emo-stars").textContent = "⭐".repeat(emoStars);
          setTimeout(emoNext, 1300);
        } else { b.classList.add("wrong"); b.disabled = true; document.getElementById("emo-feedback").textContent = L("emoTry"); }
      };
      box.appendChild(b);
    });
  }

  /* 2. Memory cards */
  const ANIMALS = ["🐱","🐶","🐰","🦋","🐢","🐟","🦁","🐘"];
  let memN = 3, memOpen = [], memMoves = 0, memFound = 0, memLock = false;
  function memNew(){
    memOpen = []; memMoves = 0; memFound = 0; memLock = false;
    const deck = shuffle(shuffle(ANIMALS).slice(0, memN).flatMap(a => [a, a]));
    const g = document.getElementById("mem-grid");
    g.style.gridTemplateColumns = `repeat(${memN === 3 ? 3 : 4}, auto)`;
    g.innerHTML = "";
    deck.forEach(a => {
      const c = document.createElement("button"); c.className = "mem-card"; c.dataset.a = a;
      c.innerHTML = `<span class="f">★</span><span class="b">${a}</span>`;
      c.setAttribute("aria-label", "?");
      c.onclick = () => memFlip(c); g.appendChild(c);
    });
    memInfo();
  }
  function memFlip(c){
    if (memLock || c.classList.contains("open") || c.classList.contains("done")) return;
    c.classList.add("open"); c.setAttribute("aria-label", c.dataset.a); memOpen.push(c);
    if (memOpen.length === 2){
      memMoves++; const [a, b] = memOpen;
      if (a.dataset.a === b.dataset.a){
        a.classList.add("done"); b.classList.add("done"); memOpen = []; memFound++;
        memInfo();
      } else {
        memLock = true;
        setTimeout(() => { a.classList.remove("open"); b.classList.remove("open"); a.setAttribute("aria-label","?"); b.setAttribute("aria-label","?"); memOpen = []; memLock = false; }, 900);
      }
      memInfo();
    }
  }
  function memInfo(){ document.getElementById("mem-moves").textContent = memMoves; document.getElementById("mem-pairs").textContent = `${memFound} / ${memN}`; document.getElementById("mem-feedback").textContent = memFound === memN ? L("memWin") : ""; }

  /* 3. Breathing bubble: 4s in, 4s out, 5 rounds */
  let brTimer = null, brRound = 0, brPhase = "idle";
  function brSet(){
    const lbl = document.getElementById("breath-label"), btn = document.getElementById("breath-btn"), cnt = document.getElementById("breath-count");
    btn.textContent = brPhase === "idle" || brPhase === "done" ? L("breathStart") : L("breathStop");
    lbl.textContent = brPhase === "in" ? L("breathIn") : brPhase === "out" ? L("breathOut") : brPhase === "done" ? L("breathDone") : L("breathReady");
    cnt.textContent = brRound && brPhase !== "done" ? L("breathRound").replace("{n}", brRound) : "";
  }
  function brStep(){
    const ball = document.getElementById("breath-ball");
    if (brPhase === "in"){ brPhase = "out"; ball.classList.remove("big"); }
    else {
      if (brRound >= 5){ brStop(true); return; }
      brRound++; brPhase = "in"; ball.classList.add("big");
    }
    brSet(); brTimer = setTimeout(brStep, 4000);
  }
  function brStop(done){ clearTimeout(brTimer); brTimer = null; brPhase = done ? "done" : "idle"; brRound = 0; document.getElementById("breath-ball").classList.remove("big"); brSet(); }
  function brToggle(){ if (brTimer) brStop(false); else { brRound = 0; brPhase = "out"; brStep(); } }

  /* 4. Picture schedule (kept in memory only; print to keep) */
  const ACTS = { wake:"🌅", toilet:"🚽", wash:"🧼", teeth:"🪥", dress:"👕", breakfast:"🥣", school:"🎒", lunch:"🍽️", homework:"📚", play:"🧸", outside:"🌳", screen:"📺", bath:"🛁", dinner:"🍲", story:"📖", sleep:"😴" };
  let sched = [];
  function schedBank(){
    const bank = document.getElementById("sched-bank"); bank.innerHTML = "";
    Object.keys(ACTS).forEach(k => {
      const b = document.createElement("button"); b.className = "pic";
      b.innerHTML = `<span class="e" aria-hidden="true">${ACTS[k]}</span><span>${L("acts")[k]}</span>`;
      b.onclick = () => { sched.push({ k, done:false }); schedList(); };
      bank.appendChild(b);
    });
  }
  function schedList(){
    const box = document.getElementById("sched-list");
    if (!sched.length){ box.innerHTML = `<div class="sched-empty">${L("schedEmpty")}</div>`; return; }
    box.innerHTML = `<div class="sched-strip">${sched.map((s, i) => `
      <div class="sched-item${s.done ? " done" : ""}">
        <span class="n">${i + 1}</span><span class="e" aria-hidden="true">${ACTS[s.k]}</span><span class="lbl">${L("acts")[s.k]}</span>
        <span class="acts">
          <button data-a="up" data-i="${i}" aria-label="${L("up")}">↑</button>
          <button data-a="down" data-i="${i}" aria-label="${L("down")}">↓</button>
          <button data-a="done" data-i="${i}" aria-label="${L("doneLbl")}">✓</button>
          <button data-a="del" data-i="${i}" aria-label="${L("remove")}">✕</button>
        </span>
      </div>`).join("")}</div>`;
    box.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, a = b.dataset.a;
      if (a === "up" && i > 0) [sched[i - 1], sched[i]] = [sched[i], sched[i - 1]];
      if (a === "down" && i < sched.length - 1) [sched[i + 1], sched[i]] = [sched[i], sched[i + 1]];
      if (a === "done") sched[i].done = !sched[i].done;
      if (a === "del") sched.splice(i, 1);
      schedList();
    });
  }

  /* 5. Teen check-in */
  const LV = ["😄","🙂","😐","😟","😞"];
  let thermoSel = -1;
  function thermoRender(){
    const box = document.getElementById("thermo-btns"); box.innerHTML = "";
    LV.forEach((e, i) => {
      const b = document.createElement("button");
      b.innerHTML = `<span class="e" aria-hidden="true">${e}</span>${L("levels")[i]}`;
      b.setAttribute("aria-pressed", String(i === thermoSel));
      b.onclick = () => { thermoSel = i; thermoRender(); };
      box.appendChild(b);
    });
    const out = document.getElementById("thermo-out");
    out.innerHTML = thermoSel < 0 ? "" : `<div class="card" style="border-top:5px solid var(--c)">${L("thermoTips")[thermoSel]}</div>`;
    if (thermoSel === 4) out.querySelector(".card").style.borderTopColor = "var(--warn)";
  }

  function relabel(){ emoRender(); memInfo(); brSet(); schedBank(); schedList(); thermoRender(); }

  function init(){
    document.getElementById("emo-restart").onclick = emoNew;
    document.getElementById("mem-restart").onclick = memNew;
    document.querySelectorAll("#mem-level button").forEach(b => b.onclick = () => {
      memN = +b.dataset.n; document.querySelectorAll("#mem-level button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); memNew();
    });
    document.getElementById("breath-btn").onclick = brToggle;
    document.getElementById("sched-clear").onclick = () => { sched = []; schedList(); };
    document.getElementById("sched-example").onclick = () => { sched = ["wake","toilet","teeth","dress","breakfast","school"].map(k => ({ k, done:false })); schedList(); };
    document.getElementById("sched-print").onclick = () => {
      const g = document.getElementById("schedule"); g.classList.add("print-me"); window.print(); setTimeout(() => g.classList.remove("print-me"), 500);
    };
    emoQueue = shuffle(Object.keys(FACES)); emoNext(); memNew();
  }
  return { init, relabel };
})();
</script>
