<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>مراجعة التجارب | Staff</title>
<link rel="stylesheet" href="/assets/site.css?v=28">
<style>
  body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",system-ui,sans-serif;margin:0}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .meta{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700}
  .body{white-space:pre-line;margin:0 0 10px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
  button.ok{background:var(--ok);color:#fff;border-color:transparent}
  button.no{background:var(--surface)}
  .note{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <h1>تجارب بانتظار المراجعة</h1>
  <p class="note">لا تُنشر أي تجربة إلا بعد الموافقة عليها. اقرؤوها كاملة، وتأكدوا أنها لا تحتوي على اسم أو بيانات تعرّف بصاحبها، ولا تتضمن خطرًا على طفل.</p>
  <p id="status" class="note"></p>
  <div id="list"></div>
</main>
<script>
(function(){
  const list = document.getElementById("list"), status = document.getElementById("status");
  const AGE = { under3:"أقل من 3 سنوات", "3-6":"من 3 إلى 6 سنوات", "7-12":"من 7 إلى 12 سنة", "13-18":"من 13 إلى 18 سنة", over18:"أكبر من 18 سنة", private:"لم يُذكر" };
  const LANG = { ar:"العربية", ku:"الكردية", en:"English" };

  function row(s){
    const wrap = document.createElement("article"); wrap.className = "item";
    const meta = document.createElement("p"); meta.className = "meta";
    meta.textContent = [s.name ? ("الاسم: " + s.name) : "بدون اسم", s.age ? ("العمر: " + (AGE[s.age] || s.age)) : "", "اللغة: " + (LANG[s.lang] || s.lang), new Date(s.created_at*1000).toLocaleString("ar-IQ")].filter(Boolean).join(" · ");
    const body = document.createElement("p"); body.className = "body"; body.textContent = s.body;
    const acts = document.createElement("div"); acts.className = "acts";
    const ok = document.createElement("button"); ok.className = "ok"; ok.textContent = "نشر";
    const no = document.createElement("button"); no.className = "no"; no.textContent = "رفض";
    const act = async (action) => {
      ok.disabled = no.disabled = true;
      const r = await fetch("/api/admin/stories", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: s.id, action }) });
      if (r.ok) wrap.remove(); else { status.textContent = "تعذّر الحفظ، حاولوا مرة أخرى."; ok.disabled = no.disabled = false; }
    };
    ok.addEventListener("click", () => act("approve"));
    no.addEventListener("click", () => act("reject"));
    acts.append(ok, no);
    wrap.append(meta, body, acts);
    return wrap;
  }

  fetch("/api/admin/stories").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(items => {
    if (!items.length){ status.textContent = "لا توجد تجارب بانتظار المراجعة."; return; }
    items.forEach(s => list.append(row(s)));
  }).catch(e => { status.textContent = "تعذّر التحميل (" + e.message + "). تأكدوا من رمز الدخول وقاعدة البيانات."; });
})();
</script>
</body>
</html>
