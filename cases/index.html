<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3F729B">
<title>Case sheets</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=17">
<style>
body{padding:0}
.cs{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
.cs-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.cs-top h1{font-size:22px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs input,.cs select,.cs textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
.cs textarea{min-height:76px;resize:vertical}
.cs label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.lock{max-width:420px;margin:12vh auto 0;text-align:center}
.lock input{text-align:center;margin:10px 0}
.lock-ic{width:68px;height:68px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:var(--teal);background:radial-gradient(circle at 30% 25%,#fff,var(--teal-soft) 70%);box-shadow:0 6px 22px rgba(63,114,155,.18);animation:floaty 6s ease-in-out infinite}
.lock-ic svg{width:34px;height:34px;fill:color-mix(in srgb,currentColor 13%,transparent)}
.msg{color:var(--warn);font-size:14px;min-height:20px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.note{color:var(--muted);font-size:13.5px}
.cs .btn.small{padding:7px 14px;font-size:14px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.plist{max-height:56vh;overflow:auto;margin-top:10px}
.pi{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.pi:hover,.pi.on{background:var(--teal-soft)}
.pi small{display:block;color:var(--muted)}
.due{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--sun-soft);color:var(--sun)}
.due.late{background:var(--warn-soft);color:var(--warn)}
table.v{width:100%;border-collapse:collapse;font-size:14.5px}
table.v th,table.v td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.v th{color:var(--muted);font-weight:600;font-size:13px}
.prog{display:inline-block;min-width:22px;text-align:center;border-radius:8px;padding:0 6px;background:var(--teal-soft);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.post{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:linear-gradient(180deg,var(--surface),var(--teal-soft))}
.post h3{margin:6px 0;font-size:17px}
.post p{margin:0 0 10px;font-size:15px}
.imp-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.imp-row input[type=text]{padding:6px 10px}
dialog{border:0;border-radius:20px;padding:0;max-width:680px;width:calc(100% - 24px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,40,38,.45)}
dialog form,dialog .dpad{padding:18px}
dialog h2{margin:0 0 12px;font-size:19px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
@media print{ .cs-top,.noprint,.plist,#side,.btn{display:none!important} .layout{display:block} .box{box-shadow:none;border:1px solid #bbb} body{background:#fff} }
</style>
</head>
<body>
<div class="cs" id="app">

<!-- lock screen -->
<div id="lock" class="box lock" hidden>
  <div class="lock-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2"/></svg></div>
  <h1 style="font-size:20px" data-i="title"></h1>
  <p class="note" id="lock-hint"></p>
  <input type="password" id="pw" autocomplete="off" data-ph="pass" aria-label="passphrase">
  <input type="password" id="pw2" autocomplete="off" data-ph="pass2" hidden>
  <div class="warn" id="lock-warn" hidden data-i="warnNew"></div>
  <div class="msg" id="lock-msg" role="alert"></div>
  <button class="btn primary" id="lock-go" type="button"></button>
  <p class="note" style="margin-top:14px"><button class="btn small" type="button" id="lang-l"></button> <a class="btn small" href="/" data-i="home"></a></p>
</div>

<!-- main -->
<div id="main" hidden>
  <div class="cs-top noprint">
    <div class="row"><a class="btn small" id="b-home" href="/" data-i="home"></a><h1 data-i="title"></h1></div>
    <div class="row">
      <button class="btn small" type="button" id="b-lang"></button>
      <button class="btn small" type="button" id="b-posts" data-i="posts"></button>
      <button class="btn small" type="button" id="b-xlsx" data-i="xlsx"></button>
      <button class="btn small" type="button" id="b-pdf" data-i="pdfAll"></button>
      <button class="btn small" type="button" id="b-export" data-i="export"></button>
      <button class="btn small" type="button" id="b-import" data-i="import"></button>
      <button class="btn small" type="button" id="b-pw" data-i="chpw"></button>
      <button class="btn small primary" type="button" id="b-lock" data-i="lock"></button>
      <input type="file" id="f-import" accept=".json,application/json" hidden>
    </div>
  </div>
  <div class="warn noprint" id="storewarn" hidden data-i="storeWarn"></div>
  <div class="layout">
    <aside id="side" class="box">
      <div class="row" style="justify-content:space-between"><b data-i="patients"></b>
        <span class="row"><button class="btn small" type="button" id="b-impn" data-i="importNames"></button><button class="btn small primary" type="button" id="b-newp" data-i="newPatient"></button></span></div>
      <input type="search" id="q" data-ph="search" style="margin-top:10px" aria-label="search">
      <div class="row" style="margin-top:8px"><label class="chk" style="margin:0"><input type="checkbox" id="only-due"><span data-i="onlyDue"></span></label></div>
      <div class="plist" id="plist"></div>
    </aside>
    <section id="detail"></section>
  </div>
  <p class="note noprint" data-i="foot"></p>
</div>

<!-- patient dialog -->
<dialog id="dp"><form method="dialog" id="fp">
  <h2 id="dp-t"></h2>
  <div class="grid2">
    <div><label data-i="fName"></label><input id="p-name" required></div>
    <div><label data-i="fCode"></label><input id="p-code"></div>
    <div><label data-i="fDob"></label><input id="p-dob" type="date"></div>
    <div><label data-i="fSex"></label><select id="p-sex"><option value=""></option><option value="F" data-i="female"></option><option value="M" data-i="male"></option></select></div>
    <div><label data-i="fGuardian"></label><input id="p-guardian"></div>
    <div><label data-i="fPhone"></label><input id="p-phone" type="tel" dir="ltr"></div>
    <div><label data-i="fSchool"></label><input id="p-school"></div>
    <div><label data-i="fRef"></label><input id="p-ref"></div>
    <div><label data-i="fFirst"></label><input id="p-first" type="date"></div>
    <div><label data-i="fStatus"></label><select id="p-status"><option value="active" data-i="stActive"></option><option value="paused" data-i="stPaused"></option><option value="closed" data-i="stClosed"></option></select></div>
  </div>
  <div style="margin-top:12px"><label data-i="fDx"></label><input id="p-dx"></div>
  <div class="grid2" style="margin-top:12px">
    <div><label data-i="fMeds"></label><textarea id="p-meds"></textarea></div>
    <div><label data-i="fAllergy"></label><textarea id="p-allergy"></textarea></div>
  </div>
  <div style="margin-top:12px"><label data-i="fEssential"></label><textarea id="p-ess"></textarea></div>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="p-consent"><span data-i="fConsent"></span></label>
  <div class="row" style="margin-top:16px;justify-content:space-between">
    <span class="row"><button class="btn primary" value="save" type="submit" data-i="save"></button><button class="btn" value="cancel" type="button" id="dp-cancel" data-i="cancel"></button></span>
    <button class="btn small" type="button" id="dp-del" data-i="delPatient" hidden></button>
  </div>
</form></dialog>

<!-- visit dialog -->
<dialog id="dv"><form method="dialog" id="fv">
  <h2 id="dv-t"></h2>
  <div class="grid2">
    <div><label data-i="vDate"></label><input id="v-date" type="date" required></div>
    <div><label data-i="vType"></label><select id="v-type"></select></div>
    <div><label data-i="vProg"></label><select id="v-prog"></select></div>
    <div><label data-i="vNext"></label><input id="v-next" type="date"></div>
  </div>
  <div style="margin-top:12px"><label data-i="vTreat"></label><textarea id="v-treat"></textarea></div>
  <div style="margin-top:12px"><label data-i="vProgNote"></label><textarea id="v-prognote"></textarea></div>
  <div style="margin-top:12px"><label data-i="vMeds"></label><textarea id="v-meds" style="min-height:56px"></textarea></div>
  <div class="row" style="margin-top:16px;justify-content:space-between">
    <span class="row"><button class="btn primary" value="save" type="submit" data-i="save"></button><button class="btn" type="button" id="dv-cancel" data-i="cancel"></button></span>
    <button class="btn small" type="button" id="dv-del" data-i="delVisit" hidden></button>
  </div>
</form></dialog>

<!-- daily post dialog -->
<dialog id="dpo"><form method="dialog" id="fpo">
  <h2 data-i="newPost"></h2>
  <div class="grid2">
    <div><label data-i="pDate"></label><input id="po-date" type="date" required></div>
    <div><label data-i="pAud"></label><select id="po-aud"><option value="parents" data-i="aud_parents"></option><option value="teachers" data-i="aud_teachers"></option><option value="both" data-i="aud_both"></option></select></div>
    <div><label data-i="pLang"></label><select id="po-lang"><option value="ar" data-i="langAr"></option><option value="en" data-i="langEn"></option></select></div>
  </div>
  <div style="margin-top:12px"><label data-i="pTitle"></label><input id="po-title" required></div>
  <div style="margin-top:12px"><label data-i="pBody"></label><textarea id="po-body" style="min-height:150px" required></textarea></div>
  <div class="row" style="margin-top:16px"><button class="btn primary" value="save" type="submit" data-i="save"></button><button class="btn" type="button" id="dpo-cancel" data-i="cancel"></button></div>
</form></dialog>

<!-- import names dialog -->
<dialog id="di"><div class="dpad">
  <h2 data-i="impTitle"></h2>
  <p class="note" id="imp-msg" data-i="impHint"></p>
  <div class="row"><button type="button" class="btn small" id="imp-pick" data-i="impChoose"></button><input type="file" id="imp-file" accept=".xlsx,.xls,.csv,.pdf" hidden></div>
  <div id="imp-list" style="max-height:50vh;overflow:auto;margin-top:10px"></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn primary" type="button" id="imp-add" hidden data-i="impAdd"></button><button class="btn" type="button" id="imp-cancel" data-i="cancel"></button></div>
</div></dialog>
</div>

/* ---------- crypto (PBKDF2 -> AES-GCM) ---------- */
const KEYNAME = "drsally-cases-v1";
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:250000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function seal(key, salt, data){

  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, enc.encode(JSON.stringify(data)));
  return { v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct) };
}
async function unseal(pw, blob){

  return { key, salt, data: JSON.parse(dec.decode(pt)) };
}
function readBlob(){ try { const s = localStorage.getItem(KEYNAME); return s ? JSON.parse(s) : null; } catch(e){ return null; } }

async function unlock(){

  const pw = $("pw").value, blob = readBlob();
  try {
    if (!blob){
      if (pw.length < 8){ $("lock-msg").textContent = t("short"); return; }
      if (pw !== $("pw2").value){ $("lock-msg").textContent = t("nomatch"); return; }
      SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(pw, SALT); DB = { patients: [], posts: [] }; await persist();
    } else {
      const r = await unseal(pw, blob); KEY = r.key; SALT = r.salt; DB = r.data;

  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, X.utils.json_to_sheet(pr), t("sheetP"));
  X.utils.book_append_sheet(wb, X.utils.json_to_sheet(vr.length ? vr : [{ [t("fName")]: "" }]), t("sheetV"));
  X.writeFile(wb, "case-sheets-" + today() + ".xlsx");
}
$("b-xlsx").onclick = () => { if (confirm(t("xlsxWarn"))) xlsxExport(DB.patients); };
$("b-pdf").onclick = () => pdfExport(DB.patients);

/* ---------- import names (Excel / CSV / PDF) ---------- */
const HDR = /^(name|full name|patient|الاسم|اسم|ناو|ناوی|نام)$/i;
function parseLine(s){
  s = s.replace(/\s+/g, " ").trim();
  let code = "";
  if (s.includes("|")){ const parts = s.split("|").map(x => x.trim()).filter(Boolean); s = parts[0] || ""; code = parts[1] || ""; }
  s = s.replace(/^\d+\s*[.)\-–:]\s*/, "").replace(/(\s+[\d٠-٩\/\-.:]+)+$/, "").trim();
  if (!s || s.length < 2 || s.length > 80 || !/\p{L}/u.test(s) || HDR.test(s)) return null;
  if (code.length > 20) code = "";
  return { name: s, code };
}
async function readCandidates(file){
  const ext = file.name.split(".").pop().toLowerCase(), out = [];
  if (ext === "pdf"){
    await lib(LIBS.pdf);
    const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfw;
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    for (let i = 1; i <= doc.numPages; i++){
      const c = await (await doc.getPage(i)).getTextContent();
      const rows = new Map();
      c.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5] / 3); if (!rows.has(y)) rows.set(y, []); rows.get(y).push(it.str); });
      [...rows.keys()].sort((a, b) => b - a).forEach(y => { const r = parseLine(rows.get(y).join(" ")); if (r) out.push(r); });
    }
  } else {
    await lib(LIBS.xlsx);
    const X = window.XLSX, wb = X.read(await file.arrayBuffer(), { type:"array" });
    wb.SheetNames.forEach(sn => X.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:"" }).forEach(r => {
      const cells = r.map(c => String(c).trim()).filter(Boolean); if (!cells.length) return;
      const x = parseLine(cells.join(" | ")); if (x) out.push(x);
    }));
  }
  return out;
}
let impItems = [];
function drawImp(){
  $("imp-msg").textContent = impItems.length ? "" : t("impNone");
  $("imp-list").innerHTML = impItems.map((c, i) => `<label class="imp-row"><input type="checkbox" checked data-idx="${i}" aria-label="select"><input type="text" value="${esc(c.name)}" data-nm="${i}" aria-label="name"><span class="note" dir="ltr">${esc(c.code)}</span></label>`).join("");
  $("imp-add").hidden = !impItems.length;
}
$("b-impn").onclick = () => { impItems = []; $("imp-list").innerHTML = ""; $("imp-msg").textContent = t("impHint"); $("imp-add").hidden = true; $("di").showModal(); };
$("imp-pick").onclick = () => $("imp-file").click();
$("imp-cancel").onclick = () => $("di").close();
$("imp-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  $("imp-msg").textContent = "…";
  try { impItems = await readCandidates(f); drawImp(); }
  catch(err){ impItems = []; drawImp(); $("imp-msg").textContent = t("libErr"); }
};
$("imp-add").onclick = async () => {
  let n = 0;
  $("imp-list").querySelectorAll("input[type=checkbox]").forEach(cb => {
    if (!cb.checked) return;
    const i = +cb.dataset.idx, name = $("imp-list").querySelector(`input[data-nm="${i}"]`).value.trim();
    if (!name || DB.patients.some(p => p.name.toLowerCase() === name.toLowerCase())) return;
    DB.patients.push({ id: uid(), name, code: impItems[i].code || "", status: "active", consent: false, visits: [], first: "" }); n++;
  });
  await persist(); $("di").close(); view = "patients"; render(); alert(t("impDone").replace("{n}", n));
};

/* ---------- backup / restore / change passphrase ---------- */
$("b-export").onclick = async () => {
  const blob = await seal(KEY, SALT, DB);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(blob)], { type:"application/json" }));
  a.download = "case-sheets-backup-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("b-import").onclick = () => $("f-import").click();
$("f-import").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const blob = JSON.parse(await f.text()); const pw = prompt(t("impPw")); if (pw == null) return;
    const r = await unseal(pw, blob);
    if (!confirm(t("impConfirm"))) return;
    KEY = r.key; SALT = r.salt; DB = r.data; if (!DB.posts) DB.posts = []; await persist(); curId = null; view = "patients"; render(); alert(t("imported"));
  } catch(err){ alert(t("badfile")); }
};
$("b-pw").onclick = async () => {
  const pw = prompt(t("newpw")); if (pw == null) return; if (pw.length < 8){ alert(t("short")); return; }
  SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(pw, SALT); await persist(); alert(t("pwChanged"));
};

applyLang(); $("lock").hidden = false;
})();
